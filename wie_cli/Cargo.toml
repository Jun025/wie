[package]
name = "wie_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
tracing = { workspace = true }

anyhow = { workspace = true, features = ["backtrace"] }
clap = { workspace = true }
directories = { version = "^6.0" }
fast_image_resize = "6.0.0"
rodio = { version = "^0.22", features = ["playback"] }
midir = { version = "^0.11" }
softbuffer = { version = "^0.4" }
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
winit = { version = "^0.30", features = ["x11", "wayland"] }
hqx = { git = "https://github.com/CryZe/wasmboy-rs", tag = "v0.1.3" }
png = "^0.17"

wie-backend = { workspace = true }
wie-util = { workspace = true }

wie-core-arm = { workspace = true } # wie_validate reads the SVC stub high-water mark
wie-j2me = { workspace = true }
wie-jvm-support = { workspace = true } # wie_validate --gc-stress
wie-ktf = { workspace = true }
wie-lgt = { workspace = true }
wie-skt = { workspace = true }
test-utils = { workspace = true }

[dev-dependencies]
jvm = { workspace = true } # wie_validate's exception-tally test drives the real `Jvm::exception`

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# arm32_cpu checks the `log` level on two `trace!` per guest instruction: 23% of the interpreter loop in
# a native profile (docs/report/0559 §4). Release builds compile `log`'s trace level out; debug builds,
# debug/info, and our own `tracing` logs are untouched (wie_cli/tests/log_static_level.rs).
# Native targets only: wie_featurephone sets `release_max_level_off`, and `log` refuses to compile with
# two of these features — a wasm32 build that selects both crates would unify them.
log = { version = "0.4", features = ["release_max_level_debug"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "=0.3.85" }                        # We need 0.3.85 to not break midir wasm build
getrandom = { version = "^0.4", features = ["wasm_js"] } # not direct dependency, but broken without it in wasm build

[lib]
name = "wie_cli"
path = "src/lib.rs"

[[bin]]
name = "wie_validate"
path = "src/bin/wie_validate.rs"
