# Vtable word 0 contains the raw-class pointer; method index 0 starts at word 1.
# vtable_size counts method entries, including unknown entries.
# Field indexes address 32-bit words in instance field storage.

[[class]]
name = "java/lang/Object"
vtable_size = 10
vtable = [
    { name = "getClass", descriptor = "()Ljava/lang/Class;", index = 1 },
    { name = "equals", descriptor = "(Ljava/lang/Object;)Z", index = 3 },
    { name = "toString", descriptor = "()Ljava/lang/String;", index = 4 },
]

[[class]]
name = "java/lang/Class"
vtable = [
    { name = "getResourceAsStream", descriptor = "(Ljava/lang/String;)Ljava/io/InputStream;", index = 16 },
]
field = [
    { name = "nativeClassName", descriptor = "I", index = 2 },
    { name = "initializationState", descriptor = "I", index = 4 },
]

# The comment above java/lang/String below explains the placement rule these rows follow. That
# rule now has two end-to-end measurements of its own, taken off guest compiler-generated vtables
# rather than off a dispatch, and they are what the output-side rows further down rest on:
#
#   놈3 has an AOT class `f extends java/io/InputStream` whose descriptor declares vtable_count=19
#   with its own non-zero targets at 10 12 13 14 15 16 17 18 — nine consecutive slots from 10, one
#   of them (11, read([B)) left inherited, and nothing past 18. So InputStream occupies exactly 19
#   slots, which is 10 + its nine CLDC instance methods, and a subclass's own run starts at 19.
#   That is independently where readByte()B=23 below puts DataInputStream's run.
#
#   스파이더맨3 has an AOT class `c extends java/lang/Thread`, vtable_count=21, own slots
#   11 18 19 20: 11 is its run() override and 18..20 are three new methods, so Thread occupies 18
#   slots = 10 + its eight CLDC instance methods. That is independently where setPriority=14 below
#   puts things (start=10, run=11, interrupt=12, isAlive=13, setPriority=14).
#
# Two classes, two counts, both landing on "10 + the CLDC instance-method count, in declaration
# order". java/io/OutputStream declares five (write(I) write([B) write([BII) flush() close()), so
# it occupies 15 — which is what the DataOutputStream block below needs, and what the register
# measurement there confirms independently.
[[class]]
name = "java/io/InputStream"
vtable = [
    { name = "read", descriptor = "()I", index = 10 },
    { name = "read", descriptor = "([B)I", index = 11 },
    { name = "read", descriptor = "([BII)I", index = 12 },
    { name = "available", descriptor = "()I", index = 14 },
    { name = "close", descriptor = "()V", index = 15 },
]

# 서든어택포켓 dispatches index 11 nine times, always with one argument, and that argument's class
# reads back as `[B` off the guest heap every time. The only method in this hierarchy taking a
# single byte[] is write([B)V — write([BII)V takes three words, and the register beside the array
# holds the same stale value (0x9b) across nine calls with nine different arrays, so it is a live
# register rather than an offset. Measured, not derived.
[[class]]
name = "java/io/OutputStream"
vtable = [
    { name = "write", descriptor = "([B)V", index = 11 },
]

[[class]]
name = "java/io/Reader"
vtable = [
    { name = "read", descriptor = "([C)I", index = 11 },
    { name = "close", descriptor = "()V", index = 18 },
]

# 배틀몬스터 dispatches on index 25 and 훼밀리마트타이쿤 · 서든어택포켓 on index 28, all four titles
# after they are already through boot, so these rows decide whether a title ever paints rather
# than whether it starts (measured 2026-09-22: one swallowed `Unimplemented:
# java/io/DataInputStream vtable index N` each, then paints 0 for the rest of the budget).
# 서든어택포켓 then asked for 20 with 28 filled, so it is here for the same reason and on the same
# evidence — every index in this class was named by the runtime before it was written, never
# filled ahead of a dispatch that asked for it.
#
# readByte()B = 23 is measured, and it is what fixes the whole run — including a correction to
# the rule block below, which lists only the six InputStream methods it needed. Those six cannot
# be all of them: if DataInputStream's own methods started at 16, its first five (readFully([B)
# readFully([BII) skipBytes(I) readBoolean() readByte()) would put readByte at 20, not 23. The
# measurement forces three more inherited slots, and CLDC 1.1 InputStream supplies exactly three
# after close() — mark(I) reset() markSupported() at 16 17 18 — so DataInputStream's own run
# starts at 19 and reads
#
#   19 readFully([B)  20 readFully([BII)  21 skipBytes(I)  22 readBoolean()  23 readByte()
#   24 readUnsignedByte()  25 readShort()  26 readUnsignedShort()  27 readChar()  28 readInt()
#
# with read()/read([BII)/close()/available() reusing the parent's indexes as overrides. 25 and 28
# sit 2 and 5 slots past a measured anchor inside one contiguous run, which is the shortest span
# any derived row in this file rests on.
#
# Getting one wrong is not free — unlike the argument-free Runtime/Thread reads below, these
# return different widths off the same stream, so a misplaced row would hand the guest a
# plausible wrong number instead of a named failure. That is the cost the anchor above buys down.
[[class]]
name = "java/io/DataInputStream"
vtable = [
    { name = "readFully", descriptor = "([BII)V", index = 20 },
    { name = "readByte", descriptor = "()B", index = 23 },
    { name = "readShort", descriptor = "()S", index = 25 },
    { name = "readInt", descriptor = "()I", index = 28 },
]

# 턴 and 서든어택포켓 dispatch index 19 and 훼밀리마트타이쿤 dispatches 15 16 17 19 20. This block
# used to be empty on purpose, because index 19 is writeInt(I)V if DataOutputStream's own run
# starts at 15 and writeShort(I)V if it starts at 17, and those write different byte counts to the
# guest's own stream — the wrong one corrupts what the title reads back later, silently, after a
# run that looks fine. The reason for leaving it empty is now gone, in two parts.
#
# FIRST, THE MEASUREMENT THAT SETTLES IT. The LGT compiler inlines a fixed index for java.* calls
# (they never appear in the import table the linker walks), but it still has to obey the ABI's
# calling convention, and a two-word argument is visible from the missing-entry stub. In one
# contiguous region of 훼밀리마트타이쿤's save writer, on one stream object, consecutive calls:
#
#   index 16 ×13   r2 = 0x490503c0, c1, c2 ... cb     (a string cursor the guest is incrementing)
#   index 19 ×1    r2 = 0x490503cb                    (untouched — r2 is not an argument)
#   index 20 ×5    r2 = 0x0                           (cleared — r2 IS the second argument word)
#
# Over the whole run r2 is never once zero at 15 (230 calls, 114 distinct), 16 (151/58), 17
# (69/34) or 19 (24/7), and is zero at every one of the 10 calls to 20. So index 20 takes 64 bits
# and 15..19 take 32. In the DataOutputStream declaration order — writeBoolean writeByte
# writeShort writeChar writeInt writeLong writeFloat writeDouble writeBytes writeChars writeUTF,
# the same source order the measured DataInputStream run above follows — writeLong is the FIRST
# two-word entry, at offset 5. Index 20 being it forces the run to start at 15, and every other
# start is refuted by the same data: 11/12/14/16/17/18 each put a two-word method on a slot
# measured to be one-word, and 13 would leave OutputStream three slots for five declared methods.
# Start-at-15 is the only survivor, so index 19 is writeInt(I)V.
#
# SECOND, THE CONTRADICTION THAT MOTIVATED THE EMPTINESS WAS A MISCOUNT. The old note said
# PrintStream's println(Ljava/lang/String;)V = 34 leaves "two slots unaccounted for" against a
# start at 15, and reasoned those two might belong to OutputStream. They belong to PrintStream:
# the count walked its 18 preceding print/println declarations and missed checkError()Z and
# setError()V, which the CLDC source declares ahead of the print block (rustjava declares both).
# Counting from 15 with them: checkError 15, setError 16, print ×9 at 17..25, println() 26,
# println ×7 at 27..33, println(String) 34 — on the nose. That measurement now CONFIRMS the start
# at 15 rather than contradicting it.
#
# Index 18 (writeChar) is left empty because no title has dispatched it — same discipline as
# skip(J) at 13 above. The run is measured now, so filling it is a one-line change when one does.
[[class]]
name = "java/io/DataOutputStream"
vtable = [
    { name = "writeBoolean", descriptor = "(Z)V", index = 15 },
    { name = "writeByte", descriptor = "(I)V", index = 16 },
    { name = "writeShort", descriptor = "(I)V", index = 17 },
    { name = "writeInt", descriptor = "(I)V", index = 19 },
    { name = "writeLong", descriptor = "(J)V", index = 20 },
]

# 훼밀리마트타이쿤 is the only title to reach these, and it names both of them itself rather than
# leaving them to the placement rule — which matters here, because nothing anchors java/util/
# Calendar's size and so nothing would have fixed a derived index.
#
# Index 19 is called six times in a row, right after Calendar.getInstance(), with arguments
# 1 2 5 11 12 13 — Calendar.YEAR MONTH DAY_OF_MONTH HOUR_OF_DAY MINUTE SECOND, in that order. No
# other method in this hierarchy takes that sequence; it is get(I)I reading a timestamp apart.
#
# Index 29 is the single call immediately before them, and its one argument's class reads back off
# the guest heap as java/util/Date. setTime(Ljava/util/Date;)V is the only method here taking a
# Date, so the slot is named by its argument type and not by its position.
#
# Both are declared on Calendar rather than GregorianCalendar, so the rows go on the parent, where
# the ancestor walk in vtable.rs picks them up for every subclass. GregorianCalendar's own
# computeTime/computeFields stay unplaced; no title has asked for them.
[[class]]
name = "java/util/Calendar"
vtable = [
    { name = "get", descriptor = "(I)I", index = 19 },
    { name = "setTime", descriptor = "(Ljava/util/Date;)V", index = 29 },
]

# The rows in this file were measured a title at a time, but they agree on one rule, and the rule
# is what lets a row be written for a class no title has pinned down yet:
#
#   a subclass's own methods take consecutive indexes from 10 (java/lang/Object is 10 entries),
#   in the declaration order of the CLDC library source, with overrides of an inherited method
#   reusing the parent's index instead of taking a new one, and static methods taking none.
#
# Two classes test the rule end to end rather than at a single point. java/io/InputStream above:
# CLDC declares read() read([B) read([BII) skip(J) available() close(), so the rule predicts
# 10 11 12 13 14 15 — and the measured 10/11/12/14/15 land exactly where it says, with the gap at
# 13 being `skip`, which no title has called. java/lang/String below: the rule has to span 13
# unmeasured slots between getBytes()=14 and substring(II)=28 and it arrives on the nose, then
# again at trim()=33 and toCharArray()=34 across four more. A guessed order would not survive that.
#
# It is still a derivation. The LGT ordinal table that would confirm any of it is out of reach, so
# a row written from the rule alone is a best safe guess, not a measurement — say which one you
# are looking at before building on it.
[[class]]
name = "java/lang/String"
vtable = [
    { name = "length", descriptor = "()I", index = 10 },
    { name = "charAt", descriptor = "(I)C", index = 11 },
    { name = "getBytes", descriptor = "()[B", index = 14 },
    # 훼밀리마트타이쿤's wall. Derived, not observed: the run of 15..28 the rule fixes is
    # equalsIgnoreCase compareTo regionMatches startsWith(S,I) startsWith(S) endsWith indexOf(I)
    # indexOf(I,I) lastIndexOf(I) lastIndexOf(I,I) indexOf(S) indexOf(S,I) substring(I), which is
    # exactly 13 long and so leaves no slack to absorb an error.
    { name = "startsWith", descriptor = "(Ljava/lang/String;)Z", index = 19 },
    { name = "substring", descriptor = "(II)Ljava/lang/String;", index = 28 },
    { name = "trim", descriptor = "()Ljava/lang/String;", index = 33 },
    { name = "toCharArray", descriptor = "()[C", index = 34 },
]

[[class]]
name = "java/lang/StringBuffer"
vtable = [
    { name = "append", descriptor = "(Ljava/lang/Object;)Ljava/lang/StringBuffer;", index = 17 },
    { name = "append", descriptor = "(Ljava/lang/String;)Ljava/lang/StringBuffer;", index = 18 },
    { name = "append", descriptor = "(I)Ljava/lang/StringBuffer;", index = 23 },
    { name = "delete", descriptor = "(II)Ljava/lang/StringBuffer;", index = 27 },
]

[[class]]
name = "java/io/PrintStream"
vtable = [
    { name = "println", descriptor = "(Ljava/lang/String;)V", index = 34 },
]

# 배틀몬스터 · 학교가는길 · 체스마스터 all dispatch on index 13 here, and none of them got a row
# until now. CLDC declares getRuntime() (static, no slot), the constructor, then exit(I)V
# freeMemory()J totalMemory()J gc()V — so the rule puts them at 10 11 12 13.
#
# Which of the four is at 13 is NOT settled by that, because the rule is a derivation and the
# ordinal table that would confirm it is out of reach. What IS settled is that guessing wrong
# cannot hurt — but NOT for the reason the first revision of this comment gave, which said this
# JVM has no Runtime.exit. It has one: rustjava-runtime 0.1.1 (crates.io, resolved by Cargo.lock)
# declares exit(I)V PUBLIC, and wie-jvm-support/src/runtime.rs routes it to platform().exit(),
# the same shutdown path WIPI MC_knlExit takes. The mechanism that makes a wrong guess harmless
# is placement, not absence: a virtual method with no row in this file is never assigned an
# index at all — jvm_support/vtable.rs counts it as `unplaced` and then grows the table by that
# many `target: 0` entries at the TAIL, so a guest dispatch on 10..13 cannot land on exit
# whichever of the four sits where. The other three are argument-free reads that report a fixed
# heap size or run a collection, so a wrong guess costs a wrong long or a spurious collection,
# never a terminated game.
#
# Read that before filling index 10, because it is what makes filling it NOT free: adding a row
# moves a method out of the unreachable tail and gives the guest a callable target. If the
# derivation is right that 10 is exit, that target ends the game — and a silent no-op standing in
# for it would be worse still, leaving a title that asked to quit running with nobody the wiser.
# The missing-entry stub names itself instead, which is why 10 is left empty on purpose.
[[class]]
name = "java/lang/Runtime"
vtable = [
    { name = "freeMemory", descriptor = "()J", index = 11 },
    { name = "totalMemory", descriptor = "()J", index = 12 },
    { name = "gc", descriptor = "()V", index = 13 },
]

# 메이플스토리2007 dispatches on index 13 after it is already rendering, so this row decides how
# far an otherwise-working title gets rather than whether it starts.
#
# Index 13 is not a free choice here: setPriority=14 was measured, and the rule only reaches 14
# if exactly two slots sit between run() and it. CLDC 1.1 supplies exactly two in that span,
# interrupt() then isAlive() (CLDC 1.0 has neither, which would put setPriority at 12 and
# contradict the measurement), so 12 and 13 are forced. Both candidates are argument-free, so
# either is safe to stand in for the other; isAlive() is the one declaration order puts at 13,
# and it is also the side-effect-free one of the two. The call site was NOT disassembled — the
# argument is the setPriority anchor, not an observation of 메이플스토리2007.
[[class]]
name = "java/lang/Thread"
vtable = [
    { name = "start", descriptor = "()V", index = 10 },
    { name = "isAlive", descriptor = "()Z", index = 13 },
    { name = "setPriority", descriptor = "(I)V", index = 14 },
]

[[class]]
name = "java/util/Vector"
vtable = [
    { name = "size", descriptor = "()I", index = 15 },
    { name = "elementAt", descriptor = "(I)Ljava/lang/Object;", index = 23 },
    { name = "removeElementAt", descriptor = "(I)V", index = 27 },
    { name = "insertElementAt", descriptor = "(Ljava/lang/Object;I)V", index = 28 },
]

[[class]]
name = "java/lang/Runnable"
vtable = [
    { name = "run", descriptor = "()V", index = 10 },
]

[[class]]
name = "java/util/Random"
vtable = [
    { name = "nextInt", descriptor = "()I", index = 12 },
]

[[class]]
name = "org/kwis/msp/lcdui/Jlet"
vtable = [
    { name = "startApp", descriptor = "([Ljava/lang/String;)V", index = 15 },
    { name = "pauseApp", descriptor = "()V", index = 16 },
    { name = "resumeApp", descriptor = "()V", index = 17 },
    { name = "destroyApp", descriptor = "(Z)V", index = 18 },
]

[[class]]
name = "org/kwis/msp/lcdui/Card"
vtable = [
    { name = "keyNotify", descriptor = "(II)Z", index = 25 },
    { name = "paint", descriptor = "(Lorg/kwis/msp/lcdui/Graphics;)V", index = 27 },
]
