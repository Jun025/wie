    { name = "indexOf", descriptor = "(Ljava/lang/String;I)I", index = 26 },
    { name = "substring", descriptor = "(I)Ljava/lang/String;", index = 27 },
    { name = "substring", descriptor = "(II)Ljava/lang/String;", index = 28 },
