# 학교가는길 dispatches index 12 on a java/util/Timer as the first thing it does, 3/3, and the one
# uncaught `Unimplemented` ends the boot (measured 2026-09-26 on origin/main 3d912985 — before
# #292's unwind fix the same miss was swallowed into a no-frame hang). Timer extends Object, so its
# own run starts at 10, and CLDC 1.1 declares schedule(TimerTask,J) schedule(TimerTask,Date)
# schedule(TimerTask,JJ) schedule(TimerTask,Date,J) scheduleAtFixedRate(TimerTask,JJ)
# scheduleAtFixedRate(TimerTask,Date,J) cancel() there, in that order. Order says 12 is schedule(TimerTask,JJ)V; the call site agrees on shape
# (lr 0x25c0, 3/3): r0 = the Timer, r1 = an instance of the guest's class `c`, r2:r3 = 0 and two
# stack words 0x64 0 — one object and two longs, delay 0 and period 100.
# What this cannot separate: scheduleAtFixedRate(TimerTask,JJ)V at 14 has the same shape, so only
# the order decides between them. Being wrong costs fixed-delay vs fixed-rate pacing of a 100 ms
# tick, not a missed or hung task.
[[class]]
name = "java/util/Timer"
vtable = [
    { name = "schedule", descriptor = "(Ljava/util/TimerTask;JJ)V", index = 12 },
    # be08d047cbae's game thread dies on Timer index 16 about 3 s after boot (measured 2026-09-30 by
    # the progress census: `Unimplemented: java/util/Timer vtable index 16`, uncaught, the screen
    # never changes again). The CLDC 1.1 order in the comment above ends with cancel() at 16 — the
    # seventh method of a run starting at 10 — and that is the only argument-free Timer method.
    # Order-derived: the call site was NOT disassembled.
    { name = "cancel", descriptor = "()V", index = 16 },
]

# 학교가는길's game-loop task is a guest subclass `c` of java/util/TimerTask whose descriptor says
# total=7 with no declared own field (measured 2026-09-26, docs/report/0296 ⑴-c) — so the phone's
# TimerTask is SIX words (J2SE layout: lock, state, nextExecutionTime J, period J) and word 6 is c's
# own hidden field, which c.run() loads as an object. rustjava-runtime 0.1.1 adds
# lastScheduledExecutionTime J, eight words: every tick the Timer thread overwrote word 6 with the
# low half of a timestamp and wrote word 7 past the instance, and c.run() died on 0xde07b454.
# Kept host-side instead of shrinking the field or recomputing it, so scheduledExecutionTime() keeps
# rustjava's exact value (the J2SE formula next±period drifts for fixed-delay tasks).
[[class]]
name = "java/util/TimerTask"
vtable = [
    { name = "cancel", descriptor = "()Z", index = 11 },
]
host_field = [
    { name = "lastScheduledExecutionTime", descriptor = "J" },
]

# 학교가는길 then dispatches index 32 on a java/util/Stack, 3/3 (measured 2026-09-26, with the Timer
# row above in). Stack extends Vector, and the four Vector rows above (size 15, elementAt 23,
# removeElementAt 27, insertElementAt 28) all sit where CLDC 1.1's Vector order puts them — 22
# instance methods, copyInto at 10 through removeAllElements at 31 — so Stack's own run starts at
# 32 with push(Object) pop() peek() empty() search(Object). The call site has the one-argument
# shape push needs (lr 0x138f24, r1 = a heap pointer); pop/peek/empty take none.
[[class]]
name = "java/util/Stack"
vtable = [
    { name = "push", descriptor = "(Ljava/lang/Object;)Ljava/lang/Object;", index = 32 },
    # 월드장기체스's wall after String 22 (measured 2026-09-28, call site disassembled, lr 0x15368).
    # The caller loads the Stack from this.<field>+8 -> +0x20, null-checks it, sets only r0 and
    # dispatches `ldr ip,[r3,#0x88]` (= 4 + 4*33). The result is null-checked, cast to a guest
    # class, and its fields are passed to a method on the caller's argument — a saved state being
    # restored. The function right above it pushes onto the same field's Stack via `[r3,#0x84]`
    # (= 32, the push row above). Shape `()Ljava/lang/Object;` fits pop (33) and peek (34) alike, so
    # the order decides; the save/restore pairing with push is what pop is for — peek would leave
    # every saved state on the Stack.
    { name = "pop", descriptor = "()Ljava/lang/Object;", index = 33 },
    # 73f3a21e981c's game thread dies on Stack index 35 right after its logo (measured 2026-09-30 by
    # the progress census: `Unimplemented: java/util/Stack vtable index 35`). push 32 · pop 33 are
    # pinned above, so the order continues peek 34 · empty 35 · search 36. Order-derived: the call
    # site was NOT disassembled.
    { name = "empty", descriptor = "()Z", index = 35 },
]

# An interface row's index is the method's POSITION in the interface, not a vtable slot: the
# implementer's slot is the word after the interface's name in its reference cell, plus this index
# (`prepare_generated`). run sits at 10 only when it is a direct Object subclass's one own method;
# 월드장기체스's AI class keeps it at 63, and naming its slot 10 `run` sent Thread.start into a
# paint method — the board froze on the AI's turn (docs/report, wec-import-0x64-adopt-p0 round).
[[class]]
name = "java/lang/Runnable"
vtable = [
    { name = "run", descriptor = "()V", index = 0 },
]

# 월드장기체스's wall after the Runnable fix: in a match, STAR opens the game menu and NUM1 (계속하기)
# dies in d.paint on `Unimplemented: java/lang/Integer vtable index 12` (measured 2026-10-01, call
# site disassembled, lr 0x3a8e0). The caller at 0x3a834 loads a Stack from this.<field>+8 -> +0x14,
# pops it (`[r3,#0x88]` = 33, the pop row above), casts the result, sets only r0 = that object and
# dispatches `ldr ip,[r3,#0x34]` (= 4 + 4*12). The result is ONE word stored into this.<field>+8 -> +0
# — and the sibling at 0x3a904 is the other half: it wraps that same word in a freshly constructed
# object and pushes it onto the same Stack (`[r3,#0x84]` = 32) before overwriting the word. So it is
# `stack.push(new Integer(cur))` / `cur = ((Integer) stack.pop()).intValue()`: no argument, an int
# back. That excludes longValue/doubleValue (two words) and every Object row; CLDC 1.1 Integer
# extends Object, so its own run starts at 10 with byteValue shortValue intValue longValue
# floatValue doubleValue, and the order puts intValue at 12 — the same slot the shape picks.
# byteValue/shortValue/floatValue share the one-word shape; only the order separates them, and a
# value round-tripped through an int field is what intValue is for.
[[class]]
name = "java/lang/Integer"
vtable = [
    { name = "intValue", descriptor = "()I", index = 12 },
]

[[class]]
name = "java/util/Random"
vtable = [
    # 월드장기체스's wall after String 16 (measured 2026-09-26, call site disassembled). The caller
    # loads a Random from a field, calls two native helpers, moves the second one's r0:r1 into
    # r1:r2 and dispatches `ldr ip,[r3,#0x2c]` (= 4 + 4*10); the call is followed directly by the
    # epilogue, so nothing reads a return value. The r1:r2 pair read back as 0x1a0:0xdcc55a04 =
    # 1790410316292 ms = the run's own wall-clock time. A long argument and a void result is
    # setSeed(J)V, which is also where the rule puts it (first CLDC Random method); none of the
    # other CLDC Random methods takes a long.
    { name = "setSeed", descriptor = "(J)V", index = 10 },
    { name = "nextInt", descriptor = "()I", index = 12 },
]

