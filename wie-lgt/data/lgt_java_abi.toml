# Vtable word 0 contains the raw-class pointer; method index 0 starts at word 1.
# vtable_size counts method entries, including unknown entries.
# Field indexes address 32-bit words in instance field storage.

# 배틀몬스터 dispatches on index 5, and this is the one row in the file whose every entry is
# INHERITED BY EVERY CLASS — get it wrong and the blast radius is the whole corpus, not one title.
#
# Read `vtable_size = 10` against the rule block below and the row is already half-forced: the rule
# says a subclass's own methods start at 10 because Object is 10 entries, and CLDC 1.1's Object
# declares exactly NINE virtual methods — getClass hashCode equals toString notify notifyAll
# wait(J) wait(JI) wait(). Nine into ten leaves one slot over, and the measured anchors say which:
# getClass=1 equals=3 toString=4 only line up if the run starts at 1, i.e. index 0 is not one of
# them. So 0 is left empty on purpose and the declaration order fixes the rest:
#
#   1 getClass  2 hashCode  3 equals  4 toString  5 notify()  6 notifyAll()
#   7 wait(J)  8 wait(JI)  9 wait()
#
# rustjava-runtime 0.1.1 declares ELEVEN virtual methods here, not nine — it adds clone() and
# finalize(), which CLDC 1.1 does not have. That is why the derivation drops two rather than one:
# neither is in this ABI, and both stay unplaced.
#
# Index 5 was the first one filled, and it is filled on a MEASUREMENT, not on the order alone
# (measured 2026-09-23, 배틀몬스터, both copies):
#
#   PROBE_MONITOR enter 0x488453d0          <- monitorenter, java-interface import 0x56
#   PROBE_VTABLE class=Game index=5 r0=0x488453d0 r1=... r2=... r3=...
#
# The dispatch lands on the object whose monitor the guest acquired ten microseconds earlier, which
# is the `synchronized (o) { o.???(); }` shape and so puts index 5 in the monitor family; and the
# argument registers hold a heap pointer, -1 and another heap pointer — caller leftovers, not a
# `long`, which rules out wait(J) and wait(JI). (This runtime packs argument words in order with no
# pair alignment — wie-lgt/src/runtime/java/jvm_support/method.rs, `parameter_types.insert(0, …)`
# and the `0..parameter_word_count` read — so wait(J)'s timeout would sit in r1:r2, not AAPCS's
# r2:r3. r1 is a heap pointer either way, so the exclusion stands.)
#
# wait() is then excluded by READING THE GAME CODE (binary.mod, measured 2026-09-24; ARM mode,
# .text at 0x1000, stock `objdump --triple=armv5te`, no capstone needed). The dispatch returning to
# lr=0x2308 is `ldr r3,[r0]; ldr r12,[r3,#0x18]; mov lr,pc; bx r12` at 0x22f4..0x2304 (word 6 =
# index 5), inside a function at 0x2200 that stores r1, r2 and a call result into three fields of
# `this` (field key 0x12a among them) and then dispatches index 5: straight-line, no back edge.
# Its sibling at 0x1f10 holds the image's ONE index-9 dispatch (`ldr r12,[r3,#0x28]` at 0x2018),
# and that one sits in `while (this.<field 0x12a> != 0) this.<9>();` — 0x2024 reloads the same
# field key 0x12a, 0x2048 `bne 0x2000` branches back. So the image carries both halves of a
# handshake on one field: the waiter loops on index 9, the setter signals on index 5. That puts
# wait() at 9, where the declaration order already put it, and wait() is final — one slot — so it
# cannot also be 5. Two anchors now bracket the run (1 3 4 and 9, all where the order says).
#
# What is left is notify() vs notifyAll(), and no code shape separates them: both are straight-line
# signals. The order picks notify(), and notify() is also the safe one to be wrong about: standing
# in for notifyAll() wakes one waiter instead of all. Installing a wait() where the guest meant a
# notify parks the thread forever — the silent hang this lineage has been fighting — which is why
# 7 8 stayed empty on the order alone.
#
# 간호사타이쿤2 then reached both 9 and 7 (measured 2026-09-27, binary.mod, same objdump). Its waiter
# at 0x20c00 is `synchronized (L) { L.<9>(); L.<7>((long) (30 * (2 - x) + 10)); }` on a static
# lock L: monitorenter (java import 0x56) on L at 0x20ce8, index 9 at 0x20d98 with only r0 set,
# then index 7 at 0x20e00 with a sign-extended long in r1:r2 — at run time r1:r2 = 40:0. Its
# sibling at 0x21790 is `synchronized (L) { L.<5>(); }` on the same static field (same pool word
# 0x015013da). That is the 0x1f10/0x2200 handshake again, so 9 = wait() is now reached, and 7 takes
# exactly one long, which is wait(J) and not wait(JI). Both are written; with them the waiter was
# woken by the notify within ~25 ms and cycled ~1,080 times in 60 s (paints 0 -> 722), not parked.
#
# 2 6 8 (derived) are still NOT written, for the reason java/lang/Runtime index 10 below is not: a
# missing entry says its own name, and a wrong one does not. Filling 2 would hand the guest a
# plausible wrong int; filling 8 on the order alone would risk a hang.
[[class]]
name = "java/lang/Object"
vtable_size = 10
vtable = [
    { name = "getClass", descriptor = "()Ljava/lang/Class;", index = 1 },
    # be08d047cbae, on a String key. CLDC 1.1 declares getClass hashCode equals, so 2 is the gap
    # between the measured 1 and 3. Call site measured 2026-10-03 (binary.mod file 0x8b8a0..0x8b8c0,
    # LR 0x8c890): only r0 = the key is set, `ldr ip, [r3, #0xc]`, and the result is held for the
    # bucket loop that follows (`ldr r5, [r3, #4]` out of a table indexed the line before).
    { name = "hashCode", descriptor = "()I", index = 2 },
    { name = "equals", descriptor = "(Ljava/lang/Object;)Z", index = 3 },
    { name = "toString", descriptor = "()Ljava/lang/String;", index = 4 },
    { name = "notify", descriptor = "()V", index = 5 },
    { name = "wait", descriptor = "(J)V", index = 7 },
    { name = "wait", descriptor = "()V", index = 9 },
]

# Word 0 of a class object's field block is NOT free: guest static-field accessors read its low
# halfword as flags, and with 0x2000 set they fetch the statics base from `[[word 2]+8]+0x4c`
# instead of `block+0x14` (310 `tst #0x2000` sites in 간호사타이쿤2 alone, e.g. <clinit> 0x1462ac).
# Left unpinned, RustJava's first Class field `nameBytes` landed there, so the branch followed
# `nativeClassName` into ASCII whenever that array's address had bit 13 set — WorldMap's did
# (0x48842140), GameCanvas's and SoundManager's did not. Pin RustJava's two fields onto the words
# the guest was not seen to read (1 and 3), so word 0 stays 0. Pinning only nameBytes would let
# classLoader fall through to word 4, on top of initializationState.
[[class]]
name = "java/lang/Class"
vtable = [
    { name = "getResourceAsStream", descriptor = "(Ljava/lang/String;)Ljava/io/InputStream;", index = 16 },
]
field = [
    { name = "classLoader", descriptor = "Ljava/lang/ClassLoader;", index = 1 },
    { name = "nativeClassName", descriptor = "I", index = 2 },
    { name = "nameBytes", descriptor = "[B", index = 3 },
    { name = "initializationState", descriptor = "I", index = 4 },
]

# The comment above java/lang/String below explains the placement rule these rows follow. That
# rule now has two end-to-end measurements of its own, taken off guest compiler-generated vtables
# rather than off a dispatch, and they are what the output-side rows further down rest on:
#
#   놈3 has an AOT class `f extends java/io/InputStream` whose descriptor declares vtable_count=19
#   with its own non-zero targets at 10 12 13 14 15 16 17 18 — nine consecutive slots from 10, one
#   of them (11, read([B)) left inherited, and nothing past 18. So InputStream occupies exactly 19
#   slots, which is 10 + its nine CLDC instance methods, and a subclass's own run starts at 19.
#   That is independently where readByte()B=23 below puts DataInputStream's run.
#
#   스파이더맨3 has an AOT class `c extends java/lang/Thread`, vtable_count=21, own slots
#   11 18 19 20: 11 is its run() override and 18..20 are three new methods, so Thread occupies 18
#   slots = 10 + its eight CLDC instance methods. That is independently where setPriority=14 below
#   puts things (start=10, run=11, interrupt=12, isAlive=13, setPriority=14).
#
# Two classes, two counts, both landing on "10 + the CLDC instance-method count, in declaration
# order". java/io/OutputStream declares five (write(I) write([B) write([BII) flush() close()), so
# it occupies 15 — which is what the DataOutputStream block below needs, and what the register
# measurement there confirms independently.
[[class]]
name = "java/io/InputStream"
vtable = [
    { name = "read", descriptor = "()I", index = 10 },
    { name = "read", descriptor = "([B)I", index = 11 },
    { name = "read", descriptor = "([BII)I", index = 12 },
    # 배틀몬스터 dispatches index 13 on a ByteArrayInputStream right after its splash, and the
    # one uncaught `Unimplemented` kills the thread that loads the title (measured 2026-09-23).
    # 12 and 14 are both measured, and CLDC 1.1 declares exactly one method between
    # read([BII) and available(): skip(J). The call site agrees — it sign-extends an int into
    # r1:r2 (`asr r3, n, #31`), the long argument in this runtime's sequential word order,
    # and discards the long it gets back, i.e. `in.skip(n);`.
    { name = "skip", descriptor = "(J)J", index = 13 },
    { name = "available", descriptor = "()I", index = 14 },
    { name = "close", descriptor = "()V", index = 15 },
]

# 서든어택포켓 dispatches index 11 nine times, always with one argument, and that argument's class
# reads back as `[B` off the guest heap every time. The only method in this hierarchy taking a
# single byte[] is write([B)V — write([BII)V takes three words, and the register beside the array
# holds the same stale value (0x9b) across nine calls with nine different arrays, so it is a live
# register rather than an offset. Measured, not derived.
[[class]]
name = "java/io/OutputStream"
vtable = [
    { name = "write", descriptor = "([B)V", index = 11 },
    # 61ed69520fd3 ends a save the same way from its key handler (measured 2026-09-30, 0x1b218..0x1b254,
    # one stream held at sp+8): index 12 with r1 = an array, r2 = 0 and r3 = that array's length word,
    # then index 13 and index 14, each with r0 only and the result ignored — `s.write(b, 0, b.length);
    # s.flush(); s.close();`. 12 and 13 are the declaration order between the measured write([B) (11)
    # and close() (14); the call shapes match them and nothing else in the class.
    { name = "write", descriptor = "([BII)V", index = 12 },
    { name = "flush", descriptor = "()V", index = 13 },
    # 턴 (4 sites) and 서든어택포켓 (5 sites — a separate binary) end every save the same way:
    # toByteArray (16) on the BAOS, then index 14 on the DataOutputStream wrapping it and index 14
    # on the BAOS itself, r0 only, return ignored, and neither stream is touched again before the
    # function returns — `dos.close(); baos.close();`, outer first. 14 is close() by declaration
    # order; flush() (13) has the same ()V shape, but a flush AFTER toByteArray could not change
    # the array already taken, so position rules it out. Measured 2026-09-26 (턴 0xada0/0xadb8,
    # 서든어택포켓 0x1444/0x145c).
    { name = "close", descriptor = "()V", index = 14 },
]

# 턴 and 서든어택포켓 (both copies of each) dispatch index 16 on a ByteArrayOutputStream as the
# last step of writing a save — the DataOutputStream block below wraps it. OutputStream is 15 slots
# (the rule-block measurement above), so this class's own run starts at 15, and CLDC 1.1 declares
# reset() toByteArray() size() there, in that order (write(I)/write([BII)/close() are overrides and
# toString() is Object's). Order says 16 is toByteArray; what fixes it is the RETURN VALUE, because
# toByteArray()[B and size()I both take no argument and a swap would hand the guest a length where
# it wants an array — silently. Measured 2026-09-24, 턴, one call, r0 = this and nothing else:
#
#   bx ip                      ; index 16 (ldr ip, [r3, #0x44])
#   str r0, [fp, #-0x28]
#   ldr r2, [fp, #-0x28] ; cmp r2, #0 ; moveq r0, #0 ; beq ...   ; null check
#   ldr r3, [r2, #8]           ; instance->ptr_fields
#   ldr r2, [r3]               ; the array's length word, i.e. `b.length`
#
# The result is null-checked and then dereferenced twice to reach an array length; an int from
# size() would be read as a pointer. So 16 is toByteArray()[B. 15 (reset) and 17 (size) stay empty:
# no title has asked for them, and the reason 17 is not written is exactly this row's tradeoff.
[[class]]
name = "java/io/ByteArrayOutputStream"
vtable = [
    { name = "toByteArray", descriptor = "()[B", index = 16 },
]

[[class]]
name = "java/io/Reader"
vtable = [
    { name = "read", descriptor = "([C)I", index = 11 },
    { name = "close", descriptor = "()V", index = 18 },
]

# 배틀몬스터 dispatches on index 25 and 훼밀리마트타이쿤 · 서든어택포켓 on index 28, all four titles
# after they are already through boot, so these rows decide whether a title ever paints rather
# than whether it starts (measured 2026-09-22: one swallowed `Unimplemented:
# java/io/DataInputStream vtable index N` each, then paints 0 for the rest of the budget).
# 서든어택포켓 then asked for 20 with 28 filled, so it is here for the same reason and on the same
# evidence — every index in this class was named by the runtime before it was written, never
# filled ahead of a dispatch that asked for it.
#
# readByte()B = 23 is measured, and it is what fixes the whole run — including a correction to
# the rule block below, which lists only the six InputStream methods it needed. Those six cannot
# be all of them: if DataInputStream's own methods started at 16, its first five (readFully([B)
# readFully([BII) skipBytes(I) readBoolean() readByte()) would put readByte at 20, not 23. The
# measurement forces three more inherited slots, and CLDC 1.1 InputStream supplies exactly three
# after close() — mark(I) reset() markSupported() at 16 17 18 — so DataInputStream's own run
# starts at 19 and reads
#
#   19 readFully([B)  20 readFully([BII)  21 skipBytes(I)  22 readBoolean()  23 readByte()
#   24 readUnsignedByte()  25 readShort()  26 readUnsignedShort()  27 readChar()  28 readInt()
#
# with read()/read([BII)/close()/available() reusing the parent's indexes as overrides. 25 and 28
# sit 2 and 5 slots past a measured anchor inside one contiguous run, which is the shortest span
# any derived row in this file rests on.
#
# readBoolean()Z = 22 is the same derivation — one slot before the measured readByte anchor — and
# 간호사타이쿤2 is the title that asked for it (measured 2026-09-24: `Unimplemented:
# java/io/DataInputStream vtable index 22` right after its save record loads, then paints 0). Two
# call-site facts back the row rather than just fail to refute it. The dispatch sets up no argument
# (`mov r0, r5; ldr ip, [r3, #0x5c]; bx ip`), which rules out 19 20 21. And with the row in, the
# title's reader is a type-for-type mirror of its own writer: 819 reads against 819 writes, with
# every writeBoolean answered by a readBoolean at the same position, and the reads consume exactly
# the 2673-byte record the writer stored. The limit: writeBoolean only ever writes 0 or 1, so this
# cannot tell readBoolean from readUnsignedByte by value — only the slot order separates them.
#
# readChar()C = 27 and readUTF()Ljava/lang/String; = 32 are the rule again, each asked for by a
# title (measured 2026-09-25, one `Unimplemented: java/io/DataInputStream vtable index N` each):
# 스파이더맨3 at 27 during its first resource load, 슈퍼액션히어로 at 32 as the first thing its game
# thread does. Past readInt the CLDC 1.1 run continues readLong 29, readFloat 30, readDouble 31,
# readUTF 32 — the 1.1 order the Thread count above already fixes (1.0 has no readFloat or
# readDouble, which would put readUTF at 30). Physical offsets are 4 × (index + 1).
#
#   27 — 스파이더맨3's reader dispatches `ldr r3, [r3, #0x70]` with r0 = the stream and nothing else,
#        three times, beside `#0x60` (readByte 23), `#0x68` (readShort 25, its result sizes a
#        byte[]) and `#0x50` (readFully([B) 19, into that byte[]) on the same stream. One result
#        is then walked bit by bit for exactly 16 iterations (`i <= 15`), i.e. a 16-bit value.
#        What this cannot separate: readUnsignedShort()I at 26 reads the same two bytes and
#        returns the same unsigned value, so only the slot order decides between the two — and
#        both would hand the guest the same number.
#   32 — 슈퍼액션히어로 dispatches `adds r3, #0x84; ldr r3, [r3]` with r0 = the stream and no other
#        argument, null-checks the result, and calls String's getBytes()[B (index 14, `#0x3c`)
#        on it, copying the bytes into a byte[length + 1]. It returns an object that answers
#        getBytes — a String — and readUTF() is the only no-argument DataInputStream method that
#        returns one.
#
# readUnsignedByte()I = 24 is the rule again, one past the measured readByte anchor, and it is
# asked for by one title (sha12 `73f3a21e981c`, measured 2026-09-28: `Unimplemented:
# java/io/DataInputStream vtable index 24` as the first thing its game thread does, then one
# blank paint for the rest of the budget).
#
#   24 — its reader dispatches `ldr ip, [r3, #0x64]` (LR 0x76fe4) with r0 = the stream and nothing
#        else set up, keeps only `r0 & 0xff` of the result, and does it again on the same stream
#        (LR 0x77004) — one byte per call, no argument, an int result used as a byte. That fits
#        readUnsignedByte()I and readByte()B alike; 23 is readByte by measurement, so the slot
#        order is what names 24. Both return the same low byte, so a guest that masks gets the
#        same value from either — the row cannot hand it a wrong number.
#
# readFully([B)V = 19 is the rule's first own slot, one before the readFully([BII)V row at 20,
# and 스파이더맨3 asked for it next (measured 2026-09-26: `Unimplemented: java/io/DataInputStream
# vtable index 19` 3/3, right after the 27 row above let its reader go on).
#
#   19 — the same reader dispatches `ldr r3, [r3, #0x50]` (LR 0x1b8b) with r0 = the stream and
#        r1 = the byte[] it just allocated with length readShort() − 4, and nothing else set up
#        for it (r2 holds a stale 8 from the allocation). Read off the guest heap at the trap,
#        that argument is class `[B` with length 30, 3/3 — a single byte[], which rules out
#        20 and 21, and the result is discarded. readFully([B)V is the only DataInputStream
#        method of that shape.
#        What this does not have: a second call site. A sweep of the 91 LGT titles in the local
#        corpus finds no other `#0x50` dispatch on a DataInputStream, and a 20-second run of each
#        reaches index 19 only in 스파이더맨3 — so the row rests on one site plus the slot rule.
#
# Getting one wrong is not free — unlike the argument-free Runtime/Thread reads below, these
# return different widths off the same stream, so a misplaced row would hand the guest a
# plausible wrong number instead of a named failure. That is the cost the anchor above buys down.
[[class]]
name = "java/io/DataInputStream"
vtable = [
    { name = "readFully", descriptor = "([B)V", index = 19 },
    { name = "readFully", descriptor = "([BII)V", index = 20 },
    { name = "readBoolean", descriptor = "()Z", index = 22 },
    { name = "readByte", descriptor = "()B", index = 23 },
    { name = "readUnsignedByte", descriptor = "()I", index = 24 },
    { name = "readShort", descriptor = "()S", index = 25 },
    { name = "readChar", descriptor = "()C", index = 27 },
    { name = "readInt", descriptor = "()I", index = 28 },
    { name = "readUTF", descriptor = "()Ljava/lang/String;", index = 32 },
]

# 턴 and 서든어택포켓 dispatch index 19 and 훼밀리마트타이쿤 dispatches 15 16 17 19 20. This block
# used to be empty on purpose, because index 19 is writeInt(I)V if DataOutputStream's own run
# starts at 15 and writeShort(I)V if it starts at 17, and those write different byte counts to the
# guest's own stream — the wrong one corrupts what the title reads back later, silently, after a
# run that looks fine. The reason for leaving it empty is now gone, in two parts.
#
# FIRST, THE MEASUREMENT THAT SETTLES IT. The LGT compiler inlines a fixed index for java.* calls
# (they never appear in the import table the linker walks), but it still has to obey the ABI's
# calling convention, and a two-word argument is visible from the missing-entry stub. In one
# contiguous region of 훼밀리마트타이쿤's save writer, on one stream object, consecutive calls:
#
#   index 16 ×13   r2 = 0x490503c0, c1, c2 ... cb     (a string cursor the guest is incrementing)
#   index 19 ×1    r2 = 0x490503cb                    (untouched — r2 is not an argument)
#   index 20 ×5    r2 = 0x0                           (cleared — r2 IS the second argument word)
#
# Over the whole run r2 is never once zero at 15 (230 calls, 114 distinct), 16 (151/58), 17
# (69/34) or 19 (24/7), and is zero at every one of the 10 calls to 20. So index 20 takes 64 bits
# and 15..19 take 32. In the DataOutputStream declaration order — writeBoolean writeByte
# writeShort writeChar writeInt writeLong writeFloat writeDouble writeBytes writeChars writeUTF,
# the same source order the measured DataInputStream run above follows — writeLong is the FIRST
# two-word entry, at offset 5. Index 20 being it forces the run to start at 15, and every other
# start is refuted by the same data: 11/12/14/16/17/18 each put a two-word method on a slot
# measured to be one-word, and 13 would leave OutputStream three slots for five declared methods.
# Start-at-15 is the only survivor, so index 19 is writeInt(I)V.
#
# SECOND, THE CONTRADICTION THAT MOTIVATED THE EMPTINESS WAS A MISCOUNT. The old note said
# PrintStream's println(Ljava/lang/String;)V = 34 leaves "two slots unaccounted for" against a
# start at 15, and reasoned those two might belong to OutputStream. They belong to PrintStream:
# the count walked its 18 preceding print/println declarations and missed checkError()Z and
# setError()V, which the CLDC source declares ahead of the print block (rustjava declares both).
# Counting from 15 with them: checkError 15, setError 16, print ×9 at 17..25, println() 26,
# println ×7 at 27..33, println(String) 34 — on the nose. That measurement now CONFIRMS the start
# at 15 rather than contradicting it.
#
# Index 18 (writeChar) is left empty because no title has dispatched it — same discipline as
# skip(J) at 13 above. The run is measured now, so filling it is a one-line change when one does.
[[class]]
name = "java/io/DataOutputStream"
vtable = [
    { name = "writeBoolean", descriptor = "(Z)V", index = 15 },
    { name = "writeByte", descriptor = "(I)V", index = 16 },
    { name = "writeShort", descriptor = "(I)V", index = 17 },
    { name = "writeInt", descriptor = "(I)V", index = 19 },
    { name = "writeLong", descriptor = "(J)V", index = 20 },
    # b475b6399684's game thread dies on index 24 when its manual's OK writes a record
    # (measured 2026-10-02: `Unimplemented: java/io/DataOutputStream vtable index 24`,
    # r1 = a heap object, lr 0x31b3f), leaving the manual page up with every key dead. Counting
    # on from 15 in CLDC 1.1 order — writeChar 18, writeFloat 21, writeDouble 22, writeChars 23,
    # writeUTF 24 — CLDC has no writeBytes (J2SE's, which would push writeUTF to 25). The reader
    # side already rules J2SE order out: readUTF is measured at 32, right after readDouble 31,
    # where J2SE's readLine would sit.
    { name = "writeUTF", descriptor = "(Ljava/lang/String;)V", index = 24 },
]

# 훼밀리마트타이쿤 is the only title to reach these, and it names both of them itself rather than
# leaving them to the placement rule — which matters here, because nothing anchors java/util/
# Calendar's size and so nothing would have fixed a derived index.
#
# Index 19 is called six times in a row, right after Calendar.getInstance(), with arguments
# 1 2 5 11 12 13 — Calendar.YEAR MONTH DAY_OF_MONTH HOUR_OF_DAY MINUTE SECOND, in that order. No
# other method in this hierarchy takes that sequence; it is get(I)I reading a timestamp apart.
#
# Index 29 is the single call immediately before them, and its one argument's class reads back off
# the guest heap as java/util/Date. setTime(Ljava/util/Date;)V is the only method here taking a
# Date, so the slot is named by its argument type and not by its position.
#
# Both are declared on Calendar rather than GregorianCalendar, so the rows go on the parent, where
# the ancestor walk in vtable.rs picks them up for every subclass. GregorianCalendar's own
# computeTime/computeFields stay unplaced; no title has asked for them.
[[class]]
name = "java/util/Calendar"
vtable = [
    { name = "get", descriptor = "(I)I", index = 19 },
    # 73f3a21e981c builds a date at 0x5b9c0 (binary.mod, objdump --triple=armv5te, read 2026-10-05):
    # four calls through word 0x74 = index 28 with (1, y) (2, m - 1) (5, d) (10, 0) — YEAR MONTH
    # DAY_OF_MONTH HOUR, the only two-int method here being set(II)V — then one through word 0x5c =
    # index 22 with no arguments whose result is null-checked and kept: getTime(). Its game thread
    # died on 28, then (with 28 written) on 22.
    { name = "getTime", descriptor = "()Ljava/util/Date;", index = 22 },
