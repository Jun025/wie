# The rows in this file were measured a title at a time, but they agree on one rule, and the rule
# is what lets a row be written for a class no title has pinned down yet:
#
#   a subclass's own methods take consecutive indexes from 10 (java/lang/Object is 10 entries),
#   in the declaration order of the CLDC library source, with overrides of an inherited method
#   reusing the parent's index instead of taking a new one, and static methods taking none.
#
# Two classes test the rule end to end rather than at a single point. java/io/InputStream above:
# CLDC declares read() read([B) read([BII) skip(J) available() close(), so the rule predicts
# 10 11 12 13 14 15 — and the measured 10/11/12/14/15 land exactly where it says, with the gap at
# 13 being `skip`, which no title has called. java/lang/String below: the rule has to span 13
# unmeasured slots between getBytes()=14 and substring(II)=28 and it arrives on the nose, then
# again at trim()=33 and toCharArray()=34 across four more. A guessed order would not survive that.
#
# It is still a derivation. The LGT ordinal table that would confirm any of it is out of reach, so
# a row written from the rule alone is a best safe guess, not a measurement — say which one you
# are looking at before building on it.
[[class]]
name = "java/lang/String"
vtable = [
    { name = "length", descriptor = "()I", index = 10 },
    { name = "charAt", descriptor = "(I)C", index = 11 },
    # 73f3a21e981c's wall once PrintStream 27 landed (measured 2026-10-02, call site disassembled,
    # lr 0xbe114): r1 = 0, r2 = the length a slot-10 dispatch just returned, r3 = an array from a
    # field, one stack word 0 — `s.getChars(0, s.length(), buf, 0)`, four arguments, void. The
    # rule puts getChars(II[CI)V between charAt 11 and getBytes 14, at 12.
    { name = "getChars", descriptor = "(II[CI)V", index = 12 },
    { name = "getBytes", descriptor = "()[B", index = 14 },
    # 월드장기체스's wall (measured 2026-09-25, call site disassembled). CCC.<init> checks one
    # String against constant-pool Strings in a chain: `if (s.<16>(c) == 0) flag = 1`, four
    # constants in turn, every one branching to the same flag store, then a second chain of the
    # same shape against other constants. r1 reads back off the guest heap as java/lang/String,
    # the receiver is null-checked first, and the result is only ever compared with 0. The rule
    # puts compareTo(String)I here, and the chain rules out its String-argument neighbours:
    # equalsIgnoreCase (15) returns 0 on a MISMATCH, so "any zero sets the flag" would set it
    # for every string; startsWith/endsWith/indexOf sit at 19/20/25.
    { name = "compareTo", descriptor = "(Ljava/lang/String;)I", index = 16 },
    # 훼밀리마트타이쿤's wall. Derived, not observed: the run of 15..28 the rule fixes is
    # equalsIgnoreCase compareTo regionMatches startsWith(S,I) startsWith(S) endsWith indexOf(I)
    # indexOf(I,I) lastIndexOf(I) lastIndexOf(I,I) indexOf(S) indexOf(S,I) substring(I), which is
    # exactly 13 long and so leaves no slack to absorb an error.
    # Call sites observed 2026-09-24 (derived, not measured — nothing below refutes the row):
    # at 19 the caller sets only r1, to an object, and stores the result, which leaves the
    # one-object-argument non-void candidates 15 16 19 20 and rules out startsWith(S,I) at 18.
    # The same split loop that measures 21 below also dispatches 27 as substring(pos+1) (one int
    # argument, result reassigned to the string), again where the rule puts it — so the run is
    # observed-consistent to 21 (two slots past 19) and 27, with 19's own slot still inferred.
    { name = "startsWith", descriptor = "(Ljava/lang/String;)Z", index = 19 },
    # 일지매영웅전기's wall. The rule puts indexOf(I)I here, and the call site agrees (measured
    # 2026-09-24): r1 = 0x7c ('|') with r2 left holding a stale heap pointer, i.e. ONE int
    # argument; the result is tested `cmp r0, #0 ; blt` and then passed as the end index of
    # index 28, `substring(0, i)` — a split on '|'. That rules out every String/two-argument
