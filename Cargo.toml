[workspace]
resolver = "2"

members = [
    "wie-backend",
    "wie-util",
    "wie-core-arm",
    "wie-jvm-support",
    "wie-wipi-java",
    "wie-wipi-c",
    "wie-j2me",
    "wie-ktf",
    "wie-ktf-dump",
    "wie-lgt",
    "wie-skt",
    "wie-web",
    "wie_cli",
    "wie_featurephone",
]

# wie-app is upstream's Tauri desktop shell. It arrived with the 2026-09-16
# upstream base swap (absent from our pre-swap main, present on upstream/main)
# and we have never adopted it: nothing of ours references it, and the only
# thing that builds it — upstream's release.yaml — is parked to
# workflow_dispatch. Left in members it is the SOLE root of gtk/webkit2gtk/
# libsoup3 (`cargo tree --workspace -i glib-sys --target x86_64-unknown-linux-gnu`
# → wie-app → tauri → gtk), which our Linux CI does not install, so
# `cargo clippy --all` and `cargo tarpaulin` both died on glib-sys there while
# macOS and Windows stayed green. Excluded rather than deleted: adopting the
# desktop shell later is a deliberate act, and that is the moment to put this
# line back. `exclude` (not merely dropping it from members) is what cargo
# itself asks for — otherwise `cd wie-app` errors with "believes it's in a
# workspace when it's not".
#
# The cost, measured rather than glossed: `cd wie-app && cargo check` used to
# SUCCEED on macOS (2m33s — that host never compiles the GTK deps, which is
# also why the macOS/Windows CI lanes stayed green); excluded, it fails with
# "error inheriting `edition` from workspace root" because that crate uses
# `version/edition/license.workspace = true` and exclusion cuts the link.
# Keeping it buildable standalone would mean rewriting upstream's own manifest
# to literal values — permanent merge friction on every upstream pull — so the
# cheaper trade is this line. Re-adding it to members restores both.
exclude = ["wie-app"]

default-members = ["."]

[profile.dev.package.wie-core-arm]
opt-level = 1

[profile.dev.package.arm32_cpu]
opt-level = 1

[profile.release]
lto = true

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT"
description = "WIPI and J2ME emulator components"
repository = "https://github.com/dlunch/wie"

[workspace.dependencies]
anyhow = { version = "^1.0" }
async-recursion = { version = "^1.1", default-features = false }
async-trait = { version = "^0.1", default-features = false }
bitflags = { version = "^2.13", default-features = false }
bytemuck = { version = "^1.25", default-features = false, features = ["derive"] }
clap = { version = "^4.6", features = ["derive"] }
dyn-clone = { version = "^1.0", default-features = false }
encoding_rs = { version = "^0.8", default-features = false, features = ["alloc"] }
futures = { version = "^0.3", default-features = false, features = ["alloc"] }
jvm = { version = "^0.1.1" }
jvm-bytecode = { version = "^0.1.1" }
jvm-class-proto = { version = "^0.1.1" }
jvm-types = { version = "^0.1.1" }
lazy_static = { version = "^1.5", default-features = false }
md5 = { version = "^0.8", default-features = false }
rustjava-runtime = { version = "^0.1.1" }
serde = { version = "^1", default-features = false, features = ["derive", "alloc"] }
# Use Rustls with ureq to support Android without OpenSSL or JVM certificate-verifier setup.
sentry = { version = "^0.49", default-features = false, features = [
    "anyhow",
    "backtrace",
    "contexts",
    "debug-images",
    "logs",
    "metrics",
    "panic",
    "release-health",
    "rustls",
    "tracing",
    "ureq",
] }
spin = { version = "^0.12", features = ["spin_mutex", "rwlock"], default-features = false }
toml = { version = "^1", default-features = false, features = ["parse", "serde"] }
tracing = { version = "^0.1", default-features = false, features = ["attributes"] }
tracing-subscriber = { version = "^0.3", features = ["env-filter", "time"] }
wipi-types = { version = "^0.0.2" }

wie-backend = { version = "0.1.0", path = "wie-backend" }
wie-j2me = { version = "0.1.0", path = "wie-j2me" }
wie-ktf = { version = "0.1.0", path = "wie-ktf" }
wie-lgt = { version = "0.1.0", path = "wie-lgt" }
wie-midp = { version = "0.1.0", path = "wie-midp" }
wie-skt = { version = "0.1.0", path = "wie-skt" }
wie-util = { version = "0.1.0", path = "wie-util" }
wie-core-arm = { version = "0.1.0", path = "wie-core-arm" }
wie-jvm-support = { version = "0.1.0", path = "wie-jvm-support" }
wie-skvm = { version = "0.1.0", path = "wie-skvm" }
wie-wipi-c = { version = "0.1.0", path = "wie-wipi-c" }
wie-wipi-java = { version = "0.1.0", path = "wie-wipi-java" }

# dev-dependencies
futures-test = { version = "^0.3" }

test-utils = { path = "test-utils" }

[package]
name = "wie"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WIPI and J2ME emulator"
repository.workspace = true
exclude = ["docs"]

[lib]
name = "wie"

[[bin]]
name = "wie"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait = { workspace = true }
clap = { workspace = true }
sentry = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

directories = { version = "^6.0" }
fast_image_resize = "6.0.0"
midir = { version = "^0.11" }
rodio = { version = "^0.22", features = ["playback"] }
softbuffer = { version = "^0.4" }
winit = { version = "^0.30", features = ["x11", "wayland"] }

wie-backend = { workspace = true }
wie-j2me = { workspace = true }
wie-ktf = { workspace = true }
wie-lgt = { workspace = true }
wie-skt = { workspace = true }
wie-util = { workspace = true }

# NOTE(slice D): the Jun025→dlunch pin staircase (docs/upstream-realign-verdict.md §8-4/§8-6)
# ended here — upstream consumes RustJava from crates.io, so the git `rev` pin is gone.
