# ── PARKED by wie-upstream-tag-release-workflow-untriaged-doc-liveness-red (2026-09-23) ──
# UPSTREAM's release TAGGER (dlunch/wie ead444fb, #1434, 2026-09-18), carried here
# verbatim so scripts/check-upstream-new-workflows.mjs stops reporting it as
# untriaged. NOT ADOPTED — it is the front half of the release pipeline
# release.yaml parks (read that file's header first):
#   * dispatched on main it runs .github/scripts/release/tag-version.sh, which
#     `cargo set-version`s the whole workspace, commits "Release X.Y.Z", tags it
#     `v*` and `git push --atomic`s that commit STRAIGHT TO `main` with the tag —
#     no branch, no PR, no review gate (upstream 6503cf38, 2026-09-26; the
#     `release/v*` branch, the version-bump PR and the `gh workflow run
#     release.yaml` step this header used to describe are gone from the script);
#   * upstream starts release.yaml from that tag push (`on.push.tags: v*`). OUR
#     release.yaml is parked without that trigger, so here the tag would start
#     nothing — this file no longer reaches release.yaml at all;
#   * what it would still do here, if that push were accepted: every
#     **/Cargo.toml changes on `main`, and that glob is publish-artifact.yml's
#     release trigger — an engine artifact release plus an otterpebble dispatch.
# Its triggers are unchanged from upstream — upstream already ships it
# dispatch-only — so parking here means: the decision is written down, and
# scripts/check-parked-workflows.mjs (PARKED) reddens if an upstream merge ever
# adds a push/schedule/tag trigger to it. The body below is upstream's as of the
# 2026-11-23 merge (it now checks out with `secrets.ADMIN_GH_TOKEN`, which this
# fork does not define, and its scripts ARE in our tree since that merge).
# DO NOT DISPATCH. REOPEN with release.yaml, never alone — same product decision.
# `git show upstream/main:.github/workflows/tag-release.yaml` is the original.
name: Tag release
run-name: Tag v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z, without v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.ADMIN_GH_TOKEN }}
          fetch-depth: 0
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Set release version and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash .github/scripts/release/tag-version.sh
