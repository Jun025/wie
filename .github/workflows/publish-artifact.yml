name: Publish engine artifact (→ otterpebble propagation)

# Federation ① sender. When the engine changes on main, build a FRESH wie_featurephone WASM
# from current source, publish it as a versioned, hash-pinned GitHub Release asset,
# and signal otterpebble via repository_dispatch so featurephone.otterpebble.com
# serves the new engine with no human step. otterpebble owns the receiver
# (apps/featurephone/.github/workflows/wie-artifact-receive.yml, event_type
# wie-artifact-published) — this workflow only produces the signal it consumes.
#
# Public repo → free Actions and PUBLIC release-asset download URLs (the receiver
# curls them unauthenticated). No game files are produced or bundled (WASM only).
#
# Dispatch is TOKEN-GATED: it needs a token with contents:write on otterpebble
# (the default GITHUB_TOKEN only reaches this repo). Absent → build+release still
# run, dispatch skips (dormant), activates the instant the secret is injected.

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "scripts/build-wasm.sh"
      - "data/**"
      # fonts/ is gone after the upstream base swap; the embedded font is now
      # assets/neodgm.ttf (include_bytes!'d by the browser host). Keep in sync
      # with engine-contract.yml's paths-filter (Constraint 4).
      - "assets/**"
      # The audio worklet and the soundfont prelude are include_str!'d into the wasm, and the
      # prelude's bytes come from the exact-pinned devDependencies in the lockfile (2026-09-28).
      - "wie_featurephone/src/*.js"
      - "wie_featurephone/src/*.mjs"
      - "scripts/build-soundfont-prelude.mjs"
      - "package-lock.json"
      - "licenses/**"
      - ".github/workflows/publish-artifact.yml"
  workflow_dispatch:

permissions:
  contents: write # gh release create (this repo)

concurrency:
  group: publish-artifact
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    env:
      # Job-level so the dispatch step's `if:` can read it (step-level env is not
      # visible to that same step's `if:`). The token itself is never printed.
      HAS_DISPATCH_TOKEN: ${{ secrets.OTTERPEBBLE_DISPATCH_TOKEN != '' }}
      OTTERPEBBLE_REPO: Jun025/otterpebble
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: player-data.mjs pins each update file to the merge that added it.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-publish-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-publish-wasm-

      - name: Install wasm-bindgen-cli (pinned to Cargo.lock)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.108

      # apt binaryen is too old for modern wasm; pull a recent release so
      # `wasm-opt -Oz` (in build-wasm.sh) shrinks the bundle. build-wasm.sh falls
      # back to the unoptimized (valid) wasm if this is ever unavailable.
      - name: Install binaryen (wasm-opt)
        run: |
          VER=version_119
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/${VER}/binaryen-${VER}-x86_64-linux.tar.gz" | tar xz
          echo "$PWD/binaryen-${VER}/bin" >> "$GITHUB_PATH"

      - name: Build fresh wie_featurephone WASM (current source)
        run: bash scripts/build-wasm.sh

      # ── Featurephone consumer-contract gate (fail-closed) ──────────────────
      # The same two checks engine-contract.yml runs on PRs. Here they gate the
      # RELEASE: a contract-breaking artifact is never published or dispatched,
      # so a break that somehow lands on main still cannot reach the web shell.
      # Contract pin: docs/contracts/featurephone-engine-contract.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Contract gate — static surface (featurephone consumer)
        run: node scripts/check-engine-contract.mjs

      - name: Contract gate — browser boot round-trip
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/contract-roundtrip.mjs

      - name: Compute artifact metadata (version · sha · hashes)
        id: meta
        run: |
          set -euo pipefail
          WASM=web/src/wasm/wie_web_bg.wasm
          GLUE=web/src/wasm/wie_web.js
          test -f "$WASM" && test -f "$GLUE"
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          WIE_HEAD=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          WASM_SHA=$(sha256sum "$WASM" | cut -d' ' -f1)
          GLUE_SHA=$(sha256sum "$GLUE" | cut -d' ' -f1)
          {
            echo "version=$VERSION"
            echo "wie_head=$WIE_HEAD"
            echo "tag=engine-$SHORT"
            echo "wasm_sha=$WASM_SHA"
            echo "glue_sha=$GLUE_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "built version=$VERSION head=$WIE_HEAD wasm=$WASM_SHA glue=$GLUE_SHA"

      # Public data (docs/contracts/featurephone-public-data.md): the player-facing title list and
      # change feed ride the same release, so they reach the shell with the same pin bump.
      - name: Build public data (compat.json · updates.json)
        id: pdata
        run: |
          set -euo pipefail
          node scripts/player-data.mjs build --out public-data
          {
            echo "compat_sha=$(sha256sum public-data/compat.json | cut -d' ' -f1)"
            echo "updates_sha=$(sha256sum public-data/updates.json | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (assets = wasm + glue + public data + third-party audio licenses)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # The wasm carries spessasynth_core (Apache-2.0 §4(a): ship the license with it), and the
          # shell hosts GeneralUser GS beside it. Contract soundfontPrelude.licenses lists these.
          LICENSES="licenses/Apache-2.0.txt licenses/GeneralUser-GS-2.0.1-LICENSE.txt licenses/THIRD_PARTY_AUDIO.md"
          # Idempotent: a re-run on the same commit (same tag) reuses the release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — uploading/overwriting assets"
            gh release upload "$TAG" web/src/wasm/wie_web_bg.wasm web/src/wasm/wie_web.js public-data/compat.json public-data/updates.json $LICENSES --clobber
          else
            gh release create "$TAG" \
              --title "wie engine $TAG" \
              --notes "Fresh wie_featurephone WASM (${{ steps.meta.outputs.wie_head }}). Auto-published for otterpebble/featurephone propagation." \
              web/src/wasm/wie_web_bg.wasm web/src/wasm/wie_web.js public-data/compat.json public-data/updates.json $LICENSES
          fi
          BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG"
          {
            echo "wasm_url=$BASE/wie_web_bg.wasm"
            echo "glue_url=$BASE/wie_web.js"
            echo "base=$BASE"
          } >> "$GITHUB_OUTPUT"

      # Signal otterpebble. Token-gated: skips (dormant) when the secret is absent.
      - name: Dispatch to otterpebble (repository_dispatch)
        if: ${{ env.HAS_DISPATCH_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.OTTERPEBBLE_DISPATCH_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg version    "${{ steps.meta.outputs.version }}" \
            --arg wieHead    "${{ steps.meta.outputs.wie_head }}" \
            --arg wasmUrl    "${{ steps.release.outputs.wasm_url }}" \
            --arg glueUrl    "${{ steps.release.outputs.glue_url }}" \
            --arg wasmSha256 "${{ steps.meta.outputs.wasm_sha }}" \
            --arg glueSha256 "${{ steps.meta.outputs.glue_sha }}" \
            --arg base       "${{ steps.release.outputs.base }}" \
            --arg compatSha256  "${{ steps.pdata.outputs.compat_sha }}" \
            --arg updatesSha256 "${{ steps.pdata.outputs.updates_sha }}" \
            '{event_type:"wie-artifact-published",
              client_payload:{version:$version, wieHead:$wieHead,
                wasmUrl:$wasmUrl, glueUrl:$glueUrl,
                wasmSha256:$wasmSha256, glueSha256:$glueSha256,
                confirmedPlatforms:["KTF","SKT","LGT"],
                publicData:{compatUrl:($base+"/compat.json"), compatSha256:$compatSha256,
                  updatesUrl:($base+"/updates.json"), updatesSha256:$updatesSha256}}}')
          echo "$payload" | gh api "repos/$OTTERPEBBLE_REPO/dispatches" --input -
          echo "::notice title=dispatched::wie-artifact-published → $OTTERPEBBLE_REPO ($TAG)"

      - name: Dispatch skipped (notice)
        if: ${{ env.HAS_DISPATCH_TOKEN != 'true' }}
        run: |
          echo "::notice title=dispatch dormant::OTTERPEBBLE_DISPATCH_TOKEN 미설정 → 릴리스까지 실행, dispatch skip. \
          otterpebble contents:write PAT 를 이 레포 secret 으로 주입하면 자동 전파 활성."
