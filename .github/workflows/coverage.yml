name: coverage

# Weekly + by hand, not on every push (2026-11-07). At `on: [push]` this job was
# 401 of ~1,480 job-minutes in the week GitHub stopped running Actions on this
# fork "due to the scale of GitHub Actions usage" — 21 runs × ~19 min, every
# branch push. It is not a required check, so nothing waits on it.
# Ticket: wie-actions-usage-cut-after-github-fork-throttle.
on:
  schedule:
    - cron: "47 19 * * 6" # Sat 19:47 UTC — once a week
  workflow_dispatch:
jobs:
  test:
    name: coverage
    runs-on: ubuntu-latest
    container:
      image: xd009642/tarpaulin:latest
      options: --security-opt seccomp=unconfined
    # ── Why this job exists and must stay green ──────────────────────────────
    # Coverage is wired deliberately. It used to run on EVERY push so a branch
    # that deletes tests showed a drop before merging; since 2026-11-07 it runs
    # weekly on main (see the trigger comment) — run it by hand
    # (`gh workflow run coverage.yml -R Jun025/wie --ref <branch>`) on a branch
    # that deletes or moves tests. The failure mode this guards against is making the number go up by
    # deleting tests rather than by covering code — if a change makes this job
    # awkward, fix the change, do not delete tests to make coverage "simpler".
    #
    # `codecov.yml` at the repo root is INTENTIONALLY EMPTY. That is not an
    # oversight or dead config: an empty file means Codecov's defaults apply,
    # and it is the pre-made hook for adding thresholds later without having to
    # rediscover where they go. Deleting it is a regression, not a cleanup.
    #
    # Job-level env so the upload step's `if:` can see it (same pattern as
    # web.yml). Forks without CODECOV_TOKEN skip the upload instead of
    # failing every push (the job stays green, the signal is just absent);
    # the token itself is never printed.
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-stable-coverage-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-stable-coverage-build-target-

      - name: Install required packages
        run: apt update;apt install -y libgtk-3-dev libasound2-dev

      - name: Generate code coverage
        run: |
          export RUST_MIN_STACK=4194304
          cargo tarpaulin --all-features --skip-clean --workspace --timeout 120 --out xml

      - name: Upload to codecov.io
        if: ${{ env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
