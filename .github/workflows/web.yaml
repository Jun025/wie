# ── PARKED by wie-p3-slice-d-merge-upstream-main-as-base-fix2 (2026-09-16) ────
# This is UPSTREAM's own Web CI, which arrived with the base swap. It cannot pass
# here: it runs `npm run build:dev`, a script that exists in upstream's
# package.json and NOT in ours (ours is the Cloudflare Pages service — measured:
# our scripts are frontend/build:wasm/dev/db:*/deploy/audit/verify). It went red
# on PR #161 the moment the merge conflict cleared and pull_request workflows
# could run for the first time.
#
# The triggers are reduced to workflow_dispatch instead of deleting the file.
# Nothing is lost: `git show upstream/main:.github/workflows/web.yaml` is the
# original, and restoring the two triggers below is the whole revert.
#
# Our equivalent is web.yml (job `build-web`, Pages project `wie-web`).
#
# ── DECIDED 2026-09-16: NOT ADOPTED (wie-adopt-slice-d-base-swap-fix2-p3) ────
# "Which upstream workflows do we adopt?" — the question the parking round left
# open — is answered for this file: we do not. It is a DUPLICATE of web.yml on
# the same trigger surface (push main + pull_request), one branch-name set older
# (no feat/* preview branches), and it builds with a script we do not have. There
# is no version of adopting it that is not "run two web CIs, one of which is
# broken". Deleting it recurs on every upstream sync, so it is kept and
# neutralized instead — the same trade as release.yaml beside it.
# ENFORCED by scripts/check-parked-workflows.mjs (always-run in
# engine-contract.yml), because this parking is a local edit to an upstream file
# and an upstream merge can restore the triggers below unnoticed.
# REOPEN if web.yml is ever retired in favour of upstream's — then this file is
# the starting point, and `build:dev` has to exist first.
# See docs/upstream-realign-p3-slices.md §D.
on:
  workflow_dispatch:

name: Web CI

jobs:
  web_ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Restore cache cargo
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo

      - name: Restore cache cargo build
        uses: actions/cache/restore@v6
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust }}-build-wasm-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.rust }}-build-wasm-target-

      - name: Restore cache .npm
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: npm install
        run: npm ci

      - name: Build
        run: npm run build:dev

      - name: Save cache cargo
        uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Save cache cargo build
        uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main'
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust }}-build-wasm-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Save cache .npm
        uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
