name: Web (wasm build + Pages deploy)

# Cloudflare Pages build images do not ship Rust, so the wasm is prebuilt here
# and only the static `web/dist` (assets + Pages Functions) is shipped. No game
# files are ever produced or bundled by this workflow.
#
# ── Why the prod deploy is NOT gated on Rust CI (rust.yml) ────────────────────
# The D1 migration + Pages production deploy run as later steps of the SAME
# build-web job, so they already require this job's wasm+frontend build to pass.
# They are deliberately NOT wired (via workflow_run) to rust.yml's result: the
# correct control point is the MERGE gate, not the deploy trigger. Once main is
# protected (required checks rust_ci/build-web/contract + PR-before-merge — see
# docs and the wie-main-branch-protection rollout), every commit that reaches a
# main push has already passed Rust CI, so the deploy is CI-green by
# construction. A cross-workflow workflow_run rewire would add real fragility
# (default-branch context, ref/secret handling) and could halt deploys for
# marginal benefit, so it is intentionally avoided. Residual risk — a direct
# push to main bypassing PRs — is closed by the same branch protection.

on:
  push:
    # feat/ux-redesign is included so its push produces a Pages *preview*
    # deployment (feat-ux-redesign.wie-web.pages.dev) for the user to review
    # before any merge.
    branches: [main, feat/cf-web-service, feat/ux-redesign]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  deployments: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    # Job-level env so the deploy step's `if:` can see it (step-level env is NOT
    # available in that same step's `if:`). The token itself is never printed.
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      # One pin for every wrangler invocation in this job — the config *validator*
      # below and the actual *deployers* further down must never drift apart, or a
      # config one version accepts is rejected by the other at deploy time (which is
      # the exact shape of the 2026-08-20 outage).
      WRANGLER_VERSION: "4.104.0"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Why this exists ──────────────────────────────────────────────────────
      # The deploy step below is `if: push && main`, so a wrangler.toml that Pages
      # refuses to parse cannot fail on a PR — it fails only after the merge, on
      # main. That happened 2026-08-20 (run 32364381443): `account_id` is valid for
      # `wrangler d1` but Pages rejects the key, and the prod deploy went red one
      # commit after the PR was green.
      #
      # `wrangler pages deploy` validates the config file BEFORE it authenticates
      # or reads the directory, so pointing it at a directory that does not exist,
      # with no CLOUDFLARE_API_TOKEN in this step's env, reaches the validator and
      # nothing else — no upload, no deployment, no account touched. Every outcome
      # other than a config-validation error is a pass; we are not testing auth.
      - name: Validate wrangler.toml as a Pages config (no deploy)
        run: |
          # Separate, ungated: if wrangler itself cannot be fetched the step must
          # fail here rather than sail past a grep that finds nothing.
          npx --yes "wrangler@$WRANGLER_VERSION" --version
          out=$(npx --yes "wrangler@$WRANGLER_VERSION" pages deploy ./__pages-config-check__ \
                  --project-name=wie-web --branch=pages-config-check 2>&1 || true)
          if grep -qi 'validation for Pages' <<<"$out"; then
            echo "$out"
            echo "::error file=wrangler.toml::wrangler.toml is not a valid Cloudflare Pages config — the prod deploy in this same workflow would fail on it after merge."
            exit 1
          fi
          echo "wrangler.toml passes Pages config validation."

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-web-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-web-wasm-

      - name: Install wasm-bindgen-cli (pinned to the wasm-bindgen crate version)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.108

      # The apt `binaryen` is too old and fails to parse modern wasm. Pull a
      # recent release so `wasm-opt -Oz` works (build-wasm.sh falls back to the
      # unoptimized bundle if this is ever unavailable).
      - name: Install binaryen (wasm-opt)
        run: |
          VER=version_119
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/${VER}/binaryen-${VER}-x86_64-linux.tar.gz" | tar xz
          echo "$PWD/binaryen-${VER}/bin" >> "$GITHUB_PATH"

      # `npm run build` runs scripts/build-wasm.sh (cargo + wasm-bindgen +
      # wasm-opt → web/src/wasm), then `tsc -b` and `vite build` → web/dist.
      - name: Build frontend (wasm + React/Vite)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: wie-web-dist
          path: web/dist

      # The deploy gates below key off HAS_CF_TOKEN alone, so a set token with an
      # empty CLOUDFLARE_ACCOUNT_ID would open them with no account pin. Fail here
      # rather than widen those `if:`s: skipping would leave a green run that shipped
      # nothing, and a misconfigured secret should be loud, not invisible.
      - name: Require the account pin before touching the remote account
        if: ${{ github.event_name == 'push' && env.HAS_CF_TOKEN == 'true' && env.HAS_CF_ACCOUNT != 'true' }}
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN is set but CLOUDFLARE_ACCOUNT_ID is empty — register it in repo Secrets (docs/CLOUDFLARE_SETUP.md §0-1). Refusing to deploy without the account pin."
          exit 1

      # Apply D1 migrations to the REMOTE prod DB BEFORE deploying, so the live
      # schema always matches the new code (no schema-mismatch window). Requires
      # CLOUDFLARE_API_TOKEN to carry D1 Edit (in addition to Pages Edit). The
      # token is referenced from secrets, never echoed/embedded (S3). Idempotent:
      # wrangler skips already-applied migrations, so this is a no-op when nothing
      # is new. Gated to `main` only — migrations touch the single shared prod DB
      # and must be deliberate (preview branches rely on graceful fallbacks).
      #
      # ★DESTRUCTIVE-AUTO-APPLY POLICY: migrations are applied automatically even
      # when they contain destructive statements (DROP TABLE / DELETE FROM /
      # TRUNCATE) — the service is pre-launch and migrations are authored
      # deliberately. Documented in docs/CLOUDFLARE_SETUP.md.
      - name: Apply D1 migrations (remote, main only)
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' && env.HAS_CF_TOKEN == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply wie-db --remote

      # The Pages project can vanish out-of-band (observed 2026-07-08: every
      # main-push deploy failed with "Project not found" [code: 8000007] while
      # the D1 step kept succeeding, i.e. only the Pages project was deleted).
      # Best-effort recreate so a missing project self-heals; when it already
      # exists the create fails and is ignored — the deploy step right after
      # remains the authoritative failure point for real auth/API errors.
      - name: Ensure Pages project exists
        if: ${{ github.event_name == 'push' && env.HAS_CF_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@$WRANGLER_VERSION" pages project create wie-web --production-branch=main || true

      # Direct-Upload deploy on push only (not PRs). Gated on the token being
      # present (S3/S8 — secrets are referenced, never embedded). functions/ at
      # the repo root is uploaded alongside the static assets. main → production,
      # other branches → preview deployment.
      - name: Deploy to Cloudflare Pages
        if: ${{ github.event_name == 'push' && env.HAS_CF_TOKEN == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=wie-web --branch=${{ github.ref_name }}
