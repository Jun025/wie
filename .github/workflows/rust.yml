# The four commit gates for this repo. Run all four locally before committing —
# `cargo clippy --workspace` alone does NOT predict this job, because
# `--workspace` checks lib targets only in the default profile while this job
# additionally denies warnings and lints the wasm target:
#
#   cargo fmt --all -- --check
#   cargo clippy --all -- -D warnings
#   cargo clippy --target wasm32-unknown-unknown -- -D warnings
#   RUST_MIN_STACK=4194304 cargo test --all
#
# ── Why the matrix ────────────────────────────────────────────────────────────
# macOS/Ubuntu/Windows × stable/beta. A warning is a build failure here (-D
# warnings), so a lint that only fires on one toolchain still reddens the PR.
#
# ── Why RUST_MIN_STACK=4194304 is not decorative ──────────────────────────────
# The JVM/ARM interpreter recurses deeply enough to overflow the default test
# THREAD stack (which is much smaller than the main-thread stack). Without the
# env var the test job stack-overflows rather than failing an assertion, so it
# is set on every platform — hence the split windows/non-windows steps below,
# which exist only because PowerShell and POSIX sh set env vars differently.
# Removing it does not "simplify" anything; it makes `cargo test --all` crash.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

name: Rust CI

jobs:
  rust_ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        rust: [stable, beta]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust }}-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.rust }}-build-target-

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install required packages
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt update;sudo apt install libasound2-dev

      - name: Install required packages
        if: matrix.os == 'windows-latest'
        run: choco install ninja

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - if: matrix.os == 'windows-latest'
        run: |
          $env:RUST_MIN_STACK=4194304
          cargo test --all

      - if: matrix.os != 'windows-latest'
        run: |
          export RUST_MIN_STACK=4194304
          cargo test --all
