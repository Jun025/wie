# The commands to run locally before committing — the four commit gates plus the
# lint gate again on beta — are listed in EXACTLY ONE place, between two markers:
#
#   AGENTS.md, the region delimited by
#       <!-- COMMIT-GATES:BEGIN … -->   …   <!-- COMMIT-GATES:END … -->
#   (in "## Definition of Done" → "### The four gates (what `rust.yml` actually
#   runs)"). Grep the marker; do not count code blocks. The `sh` blocks BELOW the
#   END marker in that same subsection are conditional extras — engine-code
#   runner, PR CI read-back — not the commit-gate list.
#
# This header deliberately does NOT repeat the commands. It used to, and the two
# copies drifted: on 2026-09-05 this file said four while AGENTS.md said six, so
# whoever opened the CI file first got the shorter answer. That was fixed by
# hand, and nothing machine-checks such a fix — so the copy was removed instead.
# One list cannot disagree with itself. (The first version of THIS pointer said
# "both fenced sh blocks in that subsection", which was already wrong when
# written — the subsection holds four. A count is a silent identifier; a named
# marker fails loudly, which is why the markers exist.)
#
# What stays here is the part AGENTS.md does not carry: why this job is shaped
# the way it is. (The steps below remain the enforcing copy — a doc/steps drift
# is a different axis, and the one a parity checker would compare.)
#
# ── Why the matrix ────────────────────────────────────────────────────────────
# macOS/Ubuntu/Windows × stable/beta. A warning is a build failure here (-D
# warnings), so a lint that only fires on one toolchain still reddens the run.
#
# ── Why only ONE leg does work on PRs and main pushes (2026-11-07) ────────────
# GitHub stopped running Actions on this fork on 2026-11-04 "due to the scale of
# GitHub Actions usage" (Actions-tab banner). Rust CI was 854 of ~1,480 job-minutes
# that week (21 runs × six legs). So on pull_request/push only ubuntu/stable runs
# the gates; the other five legs still START — every step is skipped, the job
# reports success — because three of them (`rust_ci (macos-latest, stable)`,
# `rust_ci (windows-latest, stable)`, and ubuntu) are required-check NAMES in the
# ruleset, and a name that never reports deadlocks the merge (Incident ledger).
# A job-level `if:` would not do: a skipped matrix job reports one unexpanded name.
# The full six-leg matrix runs weekly (schedule) and on workflow_dispatch — run it
# by hand before landing anything platform-specific (Windows CRLF, path handling).
# Ticket: wie-actions-usage-cut-after-github-fork-throttle.
#
# ── Why RUST_MIN_STACK=4194304 is not decorative ──────────────────────────────
# The JVM/ARM interpreter recurses deeply enough to overflow the default test
# THREAD stack (which is much smaller than the main-thread stack). Without the
# env var the test job stack-overflows rather than failing an assertion, so it
# is set on every platform — hence the split windows/non-windows steps below,
# which exist only because PowerShell and POSIX sh set env vars differently.
# Removing it does not "simplify" anything; it makes `cargo test --all` crash.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
  schedule:
    - cron: "17 19 * * 6" # Sat 19:17 UTC — the full matrix, once a week
  workflow_dispatch:

name: Rust CI

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust_ci:
    runs-on: ${{ matrix.os }}
    strategy:
      # One leg failing must not cancel the other five. Without this, a single
      # red leg leaves the rest `cancelled`, and `gh pr checks` renders all six
      # as `fail` — twice now (2026-08-27, PR #64) that was read as "the whole
      # matrix is broken" when exactly one leg was. The cost is paid only on
      # failing runs: ~13 runner-minutes, ~5 min wall (medians, n=6 runs).
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        rust: [stable, beta]

    # 'true' = this leg does the work. See «Why only ONE leg» in the header.
    env:
      FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (matrix.os == 'ubuntu-latest' && matrix.rust == 'stable') }}

    steps:
      - uses: actions/checkout@v6
        if: env.FULL == 'true'
        with:
          submodules: "recursive"

      - name: Cache cargo
        if: env.FULL == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo

      - name: Cache cargo build
        if: env.FULL == 'true'
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust }}-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.rust }}-build-target-

      - uses: dtolnay/rust-toolchain@stable
        if: env.FULL == 'true'
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install required packages
        if: env.FULL == 'true' && matrix.os == 'ubuntu-latest'
        # `update` is best-effort, `install` is not. The runner image ships
        # third-party repos we do not use (packages.microsoft.com); when one of
        # them 403s, `apt update` exits 100 and — under the default `bash -e` —
        # the step dies before installing anything. That is what reddened PR #64
        # on 2026-08-27: an external outage, in a step that runs before any
        # compilation, blocking a merge whose diff touched no Rust at all.
        # libasound2-dev comes from the Ubuntu archive, so if it genuinely
        # cannot be fetched or installed, the install below still fails the job.
        run: sudo apt-get update || true; sudo apt-get install -y libasound2-dev

      - name: Install required packages
        if: env.FULL == 'true' && matrix.os == 'windows-latest'
        run: choco install ninja

      - run: cargo fmt --all -- --check
        if: env.FULL == 'true'
      - run: cargo clippy --all -- -D warnings
        if: env.FULL == 'true'
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
        if: env.FULL == 'true'

      - if: env.FULL == 'true' && matrix.os == 'windows-latest'
        run: |
          $env:RUST_MIN_STACK=4194304
          cargo test --all

      - if: env.FULL == 'true' && matrix.os != 'windows-latest'
        run: |
          export RUST_MIN_STACK=4194304
          cargo test --all
