name: Engine contract (featurephone consumer)

# The otterpebble featurephone shell consumes this engine as a prebuilt artifact
# pair (wie_web.js glue + wie_web_bg.wasm) and calls a pinned surface on it —
# docs/contracts/featurephone-engine-contract.json is the machine-readable pin.
#
# This workflow rebuilds the artifact from the changed source and fails when the
# surface or the boot behavior drifts from that pin, so a consumer-breaking
# engine change dies HERE (engine CI, on the PR) — before publish-artifact.yml
# ever propagates it and before a user can see a broken screen. It is the
# engine-side replacement for the web shell's removed boot self-test
# (2026-07-20 delegation decision; the web repo stays untouched).
#
# Two layers:
#   1. scripts/check-engine-contract.mjs  — static surface (node-only)
#   2. scripts/contract-roundtrip.mjs     — real-browser boot round-trip using
#      the repo's own hello-world fixtures (no game files involved)
# publish-artifact.yml runs the same two checks as a fail-closed pre-release
# gate, so even a break that lands on main cannot reach featurephone.
#
# ── Always-run wrapper (required-check safe) ──────────────────────────────────
# The `contract` job is the STABLE name registered as a required status check on
# `main`. It has NO paths: filter on its triggers, so it ALWAYS runs and ALWAYS
# reports a status. A required check that is instead paths-filtered would sit at
# "Expected — Waiting for status" forever on any PR that doesn't touch the
# filtered paths, deadlocking the merge. Path relevance is detected INSIDE the
# job (dorny/paths-filter, `changes` step): when nothing engine-relevant changed
# the expensive build/checks are skipped and the job succeeds immediately; the
# job name and its required-check contract never change. Keep the filter list
# below in sync with publish-artifact.yml's on.push.paths.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: engine-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The re-measure check below counts first-parent commits back to the
          # commit that landed the worklog convention; a shallow clone would make
          # that count a lie, and the script refuses rather than report one.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Unrelated to the engine surface, and deliberately OUTSIDE the paths filter
      # below: this is the repo's only always-run node job, and a broken worklog
      # `.json` is silent everywhere else (the cockpit proposals panel just shows
      # zero cards). Node-only, no build, ~1s — it cannot slow or gate the engine
      # checks, and the job stays the always-run wrapper described in the header.
      - name: Worklog .json contract (AGENTS.md §Landing paperwork)
        run: node scripts/check-worklog-json.mjs

      # Same reasoning as the step above (always-run, node-only, ~1s), for the
      # OTHER half of §Landing paperwork: the promise to re-measure worklog
      # coverage every 10 landed rounds. This does NOT gate on the ratio — that
      # obligation is conditional and a red would recreate the per-round mandate
      # 2026-09-01 declined. It gates on the promise being kept: overdue, or a
      # sub-threshold measurement nobody answered. `origin/main` is fetched
      # explicitly because checkout leaves no remote-tracking branch for it on
      # PR builds, and HEAD there is the PR's merge commit — one phantom round.
      - name: Worklog coverage re-measure is current (AGENTS.md §Landing paperwork)
        run: |
          git fetch --no-tags --quiet origin main
          node scripts/check-worklog-coverage.mjs

      # Third always-run node step, same reasoning as the two above (~50ms, no
      # build) and OUTSIDE the paths filter ON PURPOSE: the thing it guards —
      # wie_cli/tests/dod_ci_parity.rs and its checker — is NOT in that filter, so a
      # PR that deletes the parity lock changes nothing filter-relevant and every
      # in-filter check would be skipped. It has to be a step that always reports.
      #
      # What it buys: the lock defends itself only through a #[path] reference, so
      # deleting EITHER file is a compile error, but deleting BOTH removes the test
      # target and cargo has nothing left to fail on. This step is the only
      # reference to those paths from outside the pair, which is what turns
      # "deleted the check" into a red instead of a silent green.
      - name: DoD parity lock is still wired (docs/worklog/2026-09-05-dod-ci-parity-checker.json #p0)
        run: node scripts/check-parity-lock-wired.mjs

      # Fourth always-run step, same reasoning as the three above, for Constraint
      # 9/10: until now `scripts/audit-no-leak.sh` ran ONLY from a developer's
      # `npm run audit` — no workflow called it by any path (measured: 0 hits
      # across all 8 workflow files). AGENTS.md's constraint table nonetheless
      # listed it under "Locked by", i.e. the doc promised machine enforcement
      # that did not exist. This step is that enforcement.
      #
      # OUTSIDE the paths filter on purpose: what it guards is a *repo-wide*
      # property ("no game binaries tracked", "network primitives confined to
      # lib/api.ts", "rom_hash uniqueness is per-owner"), and the diff that
      # violates it — a stray `.jar`, a raw `fetch()` in a device-local module, a
      # migration adding a global UNIQUE — need not touch a single engine path.
      # A filtered step would skip exactly the PR that needed it.
      #
      # Cost: bash + find/grep + python3, no node_modules, no network. Measured
      # 0.26-0.34s over three runs in a clean worktree.
      #
      # Ceiling: section 5's `web/dist` scan self-skips here ("not built yet"),
      # because this step deliberately runs before/without the frontend build.
      # The half that matters on a PR — `git ls-files` for tracked game binaries —
      # runs unconditionally, and dist is a fresh build of sources this same
      # script audits, so the skipped half has no input the checked half missed.
      - name: No-leak / owner-isolation audit (Constraint 9-10)
        run: bash scripts/audit-no-leak.sh

      # Fifth always-run step. `docs/report/NNNN--…` serials are allocated as
      # "disk max + 1", and disk is the MERGED tree — so two open PRs computing
      # it independently pick the same number, the filenames differ so git merges
      # both cleanly, and nothing reddens. That is the ledger-conflict shape the
      # 2026-09-07 REPORT.md split removed from file *contents* reappearing in
      # file *names*. Measured the day this landed: main held 0056, open PR #112
      # held 0056, open PR #111 held 0057.
      #
      # ALWAYS-RUN, not paths-filtered, for the same reason as the audit step
      # above: the diff that creates a duplicate serial is by construction a
      # docs-only diff, so any filter keyed on engine paths skips exactly the PR
      # that needed it. This job is the repo's only unfiltered PR gate
      # (Constraint 4), which is why the check lives here and not in a new job.
      #
      # This is the post-hoc half. The pre-emptive half (`--next-serial`, which
      # consults open PRs) is a human helper with no CI cost — it cannot be a
      # gate, because a PR cannot know what a sibling will claim after it.
      #
      # Cost: node reading one directory. No network, no node_modules.
      #
      # `--selftest` runs FIRST and is not optional. The bare mode only reddens
      # when the tree already holds a duplicate, so it stays silent when the
      # check itself is broken: deleting `process.exit(1)` from the product call
      # site leaves the bare mode at rc=0 even with two duplicate serials on
      # disk, while `--selftest` catches it (its source-slice case asserts the
      # call site still calls duplicateSerials and still exits 1). Wiring only
      # the bare mode is "the tool is right but nobody calls it" — measured on
      # this exact step during review. The sibling repo wires `--selftest` in
      # three places (docs-gate.yml, ci.yml, gate-checks.txt); wie has one
      # always-run PR gate and no local gate-checks chain, so one place is the
      # whole surface.
      - name: docs/report serials are unique (docs/worklog/2026-09-07-docs-report-serial-uniqueness.json)
        run: |
          node scripts/check-docs-report-serial.mjs --selftest
          node scripts/check-docs-report-serial.mjs

      # Detect whether this diff touches anything that can change the built
      # artifact or the pinned surface. If not, the job short-circuits to success
      # (see the wrapper note in the header). Same list as publish-artifact.yml.
      - name: Detect engine-relevant changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            engine:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/build-wasm.sh'
              - 'scripts/check-engine-contract.mjs'
              - 'scripts/contract-roundtrip.mjs'
              # builds the draw fixture the round-trip asserts the blit with —
              # editing it changes what the contract check proves.
              - 'scripts/make-draw-fixture.mjs'
              # Same reason, for Scenario E: the round-trip READS this script at
              # startup to derive the KTF fixture's bar height and key table, so
              # editing it can make the contract check throw (fail-closed) even
              # though no .rs changed. `test_data/**` below covers the built zip;
              # this covers its source.
              - 'scripts/make-wipi-keydraw-fixture.sh'
              - 'docs/contracts/**'
              - 'test_data/**'
              - 'data/**'
              - 'fonts/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/engine-contract.yml'
              - '.github/workflows/publish-artifact.yml'

      - name: No engine-relevant changes — skipping contract check
        if: steps.changes.outputs.engine != 'true'
        run: echo "No engine-relevant paths changed in this diff; the featurephone contract cannot have drifted. Reporting success without rebuilding."

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.engine == 'true'
        with:
          targets: wasm32-unknown-unknown

      # Same cache key family as publish-artifact.yml — either workflow warms
      # the other (identical build: wasm32 release of wie_web).
      - name: Cache cargo
        if: steps.changes.outputs.engine == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-publish-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-publish-wasm-

      - name: Install wasm-bindgen-cli (pinned to Cargo.lock)
        if: steps.changes.outputs.engine == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.108

      # Parity with the published artifact: same optimizer as publish-artifact.yml
      # (build-wasm.sh falls back to unoptimized-but-valid wasm if unavailable).
      - name: Install binaryen (wasm-opt)
        if: steps.changes.outputs.engine == 'true'
        run: |
          VER=version_119
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/${VER}/binaryen-${VER}-x86_64-linux.tar.gz" | tar xz
          echo "$PWD/binaryen-${VER}/bin" >> "$GITHUB_PATH"

      - name: Build wie_web WASM (current source)
        if: steps.changes.outputs.engine == 'true'
        run: bash scripts/build-wasm.sh

      - name: Contract check — static surface
        if: steps.changes.outputs.engine == 'true'
        run: node scripts/check-engine-contract.mjs

      - name: Contract check — browser boot round-trip
        if: steps.changes.outputs.engine == 'true'
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/contract-roundtrip.mjs
