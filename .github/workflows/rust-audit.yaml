name: Security audit
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
# Only read access is needed. We run `cargo audit` directly and let the JOB
# STATUS carry the signal — no GitHub Issue or check-run is created, so this
# works on a fork (where Issues are disabled and cannot be enabled via token).
# The previous rustsec/audit-check action tried to open an Issue for every
# warning and died with "Issues has been disabled in this repository." on every
# scheduled run; `issues: write` / `checks: write` were ineffective residue.
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      # Pinned rather than relying on whatever Node the runner image ships — the
      # comparison step below is the only Node in this workflow, and a silent
      # version drift there would be a checker that stops working quietly.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Vulnerabilities (vulnerabilities.count > 0) FAIL the job (cargo-audit
      # exits non-zero). Informational warnings (unmaintained / yanked) are
      # printed but NON-gating — cargo-audit exits 0 on warnings unless
      # `--deny warnings` is passed, which we deliberately do not. This keeps
      # the daily job green on the two current warnings — MEASURED 2026-09-06,
      # `cargo audit` printing "2 allowed warnings found": ttf-parser 0.25.1
      # unmaintained (RUSTSEC-2026-0192) and chacha20 0.10.0 yanked — while still
      # turning red the moment a real vulnerability appears; the two classes are
      # distinguished by exit code, not squashed by continue-on-error.
      # This list is what "allowed warning" MEANS here — and as of 2026-09-07 a
      # MACHINE compares it, in the step after this one. It used to live only in
      # this comment, and that failed silently: an earlier revision named "spin
      # 0.12.0 yanked" long after spin had been upgraded away, while chacha20
      # arrived unlisted. The COUNT was 2 before and after, so "two current
      # warnings" stayed literally true and nothing looked wrong.
      #
      # The former `--ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195`
      # (quick-xml XML DoS) is GONE as of 2026-07-31: wayland-scanner 0.31.11
      # adopted quick-xml ^0.41, so `cargo update -p wayland-scanner` lifted us
      # to the patched 0.41.0 and the suppression is no longer needed.
      #
      # The eight zip `--ignore`s of 2026-10-23 / 2026-11-22 (RUSTSEC-2026-0367/0368/
      # 0369/0429/0545/0546/0547/0548) are GONE as of 2026-11-22: the RustJava pin
      # moved to 0.4.1 (zip ^9.0.5) and wie-backend's own dependency to ^9.0, so the
      # lockfile holds zip 9.8.1 only. Their verdicts are kept in ledger §C row C-16.
      # The line below carries NO ignores again. If one is ever needed, it goes on
      # this line AND pr-audit.yml's by name, with a ledger §D row —
      # scripts/check-audit-warnings.mjs (next step) goes RED when the two lists
      # differ, when an ignored ID is no longer reported (stale — delete it), or
      # when one has no §D row. Never blanket, never a whole crate.
      #
      # WHEN THIS GOES RED, READ THE LEDGER FIRST:
      #   docs/project-kb/02_status.md — "공급망 추적 대장"
      # Section A is what is still open; section C keeps the EXPOSURE VERDICT of
      # advisories we already answered ("do we take that path?"), each with the
      # dependency version it was measured against. That version column is the
      # point: a verdict read off an old source tree stops being true when the
      # dependency moves, so re-measure the version-dependent axis rather than
      # quoting the row. Answering a repeat advisory from scratch is the waste
      # this exists to prevent.
      - name: cargo audit
        run: cargo audit

      # THREE list ↔ reality comparisons, one step, ONE `cargo audit --json` (the third,
      # added 2026-10-23, is the named --ignore list above — see the checker's IGNORES block).
      # A SEPARATE step from the audit above on purpose: that one keeps its own exit code
      # and runs with only the named ignores (Constraint 5); this one runs UNIGNORED and
      # only compares.
      #
      # (1) the expected list, .github/rust-audit-expected-warnings.json. Asymmetric by
      #     design, which is what keeps it from becoming a suppression:
      #       GONE (expected, no longer reported) -> RED. The list is stale, and that
      #         staleness is the defect this exists to catch. The fix is deleting a line.
      #       NEW  (reported, not expected)       -> printed, not red. A fresh advisory
      #         must never create pressure to reach for `--ignore`.
      #     Deleting an entry hides nothing: the warning becomes NEW and keeps printing.
      #
      # (2) section A of the prose ledger, docs/project-kb/02_status.md. Added 2026-09-08.
      #     That table declares "경고 수와 이 표의 행 수가 어긋나면 둘 중 하나가 낡은
      #     것이다" and then went stale for a month anyway — A-2/A-3 were upgraded away on
      #     2026-08-08 (22df9531) and chacha20 arrived, while three rows sat there. A human
      #     realigned it; this makes the machine say it next time. SETS, not counts:
      #     the 2026-09-06 incident had the count right and the composition wrong, and a
      #     count cannot see a swap. An unreadable table is ALSO red — a blind checker is
      #     how the ledger went quiet in the first place.
      #     ★Asymmetric since 2026-11-22, same as (1): a §A row cargo-audit no longer
      #     reports is RED (stale); a warning with no §A row is NOT — it is printed and
      #     written to the job summary as «대장에 없는 새 경고 N건: …». Both directions
      #     used to be red, and one freshly published tokio warning kept this job red for
      #     10 days (10-24 → 11-02, run 40449806714) with no change to this repo. A new
      #     VULNERABILITY is still red — the audit step above, and the checker again.
      #
      # Both comparisons read the SAME parsed warning set, so they cannot disagree about
      # what the warnings are. Cost: ~1s (measured warm locally: 0.89s / 1.09s).
      #
      # NOT a required check and cannot become one by accident: this workflow has no
      # `pull_request` / `push` trigger (schedule + workflow_dispatch only), so it never
      # reports on a PR. Promoting it is a deliberate act — do it after the ledger check
      # has a track record, not before.
      #
      # `--selftest` runs first so a broken rule reddens instead of passing silently: it
      # holds new-warning = green + summary line, new-vulnerability = red, stale row = red,
      # on synthetic input (no cargo-audit, no network).
      - name: Expected-warning list and ledger §A match reality
        run: |
          node scripts/check-audit-warnings.mjs --selftest
          node scripts/check-audit-warnings.mjs
